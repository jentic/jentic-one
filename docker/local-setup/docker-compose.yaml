services:
  db:
    # Postgres 16 with pgvector available, so OSS and enterprise checkouts (the
    # latter needs `vector`) can share one fixture volume: a volume moved between
    # images can carry a mismatched collation version (scripts/setup.sh stops on
    # it). OSS never uses the extension; its CI runs plain postgres:16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jentic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host-published port is overridable (e.g. to avoid a native Postgres on
      # 5432); the in-container port stays 5432. Set JENTIC_PG_PORT to change it.
      - "${JENTIC_PG_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jentic"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
