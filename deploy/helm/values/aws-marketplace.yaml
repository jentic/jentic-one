# AWS Marketplace deployment values (container product listing).
#
# Overlay for the jentic-one umbrella chart when deploying from the AWS
# Marketplace listing. Remaining placeholders marked <…> are filled in as the
# listing progresses (plan PR 6 / the release that pins the listing's tag).
# The ECR registry path is portal-issued and recorded below (2026-08-25):
# 709825985650 is AWS's shared Marketplace registry account; "jentic" is the
# seller namespace assigned to this product.
#
# Marketplace rule of thumb: every image a deployment pulls must come from the
# listing's ECR registry — no docker.io / ghcr.io pulls at install time.

global:
  image:
    # ECR registry path from the Marketplace portal. Used as the fallback for
    # any service without an explicit image.repository.
    registry: "709825985650.dkr.ecr.us-east-1.amazonaws.com/jentic"
    # Pin per release, per the listing's deployment instructions (the
    # Marketplace does not allow floating tags like :latest).
    tag: ""

  # Bundled in-cluster Postgres: ON by default (decided 2026-08-26, reversing
  # the brief RDS-only stance) — the first-party postgresql subchart runs the
  # official library/postgres image mirrored into the listing's ECR, so a
  # plain `helm install` is self-contained. Production buyers should still
  # prefer RDS: set postgresql.enabled=false + global.postgresql.enabled=false
  # and point global.databases.*.host at the endpoint instead.
  postgresql:
    enabled: true

  # NOTE: global.observability.otel.enabled must stay false for Marketplace
  # deploys — the sidecar image (otel/opentelemetry-collector-contrib) is
  # pulled from docker.io, which the Marketplace disallows. Mirror it into
  # the listing's ECR first if observability is needed.

  # Generated application secrets: the credential-encryption keyset, admin
  # JWT secret, invite pepper, connect state secret, AND the bundled DB's
  # role/superuser passwords — minted into a release-scoped Secret on first
  # install and reused verbatim on upgrades, so the install is secure and
  # functional with ZERO buyer-supplied values (none of these have safe
  # defaults; JENTIC_ENV=production below refuses the shipped placeholders;
  # the DB passwords are pure pod-to-pod wiring on a ClusterIP service).
  # RDS variant: set the three global.databases.*.host values + explicit
  # *.password values (explicit passwords always win over generated ones)
  # and disable the bundled DB (see the postgresql blocks). Buyers managing
  # secrets themselves: set global.appSecrets.existingSecret instead. See
  # deploy/README.md.
  appSecrets:
    generate: true

  # AWS Marketplace launch wiring — the listing's delivery option carries
  # these two override parameters (values substituted by AWS at launch):
  #   global.serviceAccount.name = ${AWSMP_SERVICE_ACCOUNT}
  #     the buyer's (IRSA) service account the app/broker pods run under —
  #     on EKS this carries the IAM role the entitlement gate calls AWS with
  #   global.awsmp.licenseSecret = ${AWSMP_LICENSE_SECRET}
  #     a Secret AWS creates at launch, mounted read-only at
  #     /var/run/secrets/aws-marketplace/license (license-file flows)
  # Manual installs: set serviceAccount.name + serviceAccount.create=true to
  # have the chart create the account, then attach IAM out of band.

# app and broker run the same jentic-one-app image, differentiated by the
# JENTIC__APPS env each subchart sets. If the Marketplace portal provisions a
# single ECR repository for the product, keep the explicit repository values
# below identical; if it provisions one repo per name, drop the overrides and
# let <global.image.registry>/<chart-name> resolve them instead.
app:
  enabled: true
  image:
    repository: "709825985650.dkr.ecr.us-east-1.amazonaws.com/jentic/jentic-one-app"
    # Stamped to the release version (X.Y.Z, no v — that's the tag the image
    # is pushed to Marketplace ECR under) by marketplace-chart.yml's bake
    # step. Empty here (falls back to global.image.tag), but the baked chart
    # needs it explicit: AWS's validator reads tags from values.yaml
    # literally and fails tag-less image blocks (MISSING_IMAGE_TAG).
    tag: ""
  # Production mode: the config loader refuses to boot with placeholder or
  # empty values for the admin JWT secret / invite pepper / connect state
  # secret. Safe here because global.appSecrets generates real values.
  extraEnv:
    JENTIC_ENV: "production"
    # Entitlement gate (contract pricing, dimensions users + executions —
    # decided 2026-08-20; `contract` is the config default so only the IDs are
    # set). IDs verified against the live listing 2026-08-28. Enabled together
    # with the checkout-shape/check-in fix — a release carrying this env MUST
    # ship that client (Count+Value entitlements, CheckInLicense after
    # checkout) or entitled buyers lock themselves out.
    JENTIC__ENTITLEMENT__ENABLED: "true"
    JENTIC__ENTITLEMENT__PRODUCT_CODE: "dwhxz1v53k58ew6pr7qzieumd"
    JENTIC__ENTITLEMENT__LICENSE_SKU: "prod-dd2p2s65dysv6"
    JENTIC__ENTITLEMENT__LICENSE_DIMENSIONS: "users,executions"

broker:
  enabled: true
  image:
    repository: "709825985650.dkr.ecr.us-east-1.amazonaws.com/jentic/jentic-one-app"
    tag: ""  # stamped by the bake step — same reasoning as app.image.tag
  extraEnv:
    JENTIC_ENV: "production"  # same reasoning as app.extraEnv above
    # Entitlement gate — same values and caveat as app.extraEnv above.
    JENTIC__ENTITLEMENT__ENABLED: "true"
    JENTIC__ENTITLEMENT__PRODUCT_CODE: "dwhxz1v53k58ew6pr7qzieumd"
    JENTIC__ENTITLEMENT__LICENSE_SKU: "prod-dd2p2s65dysv6"
    JENTIC__ENTITLEMENT__LICENSE_DIMENSIONS: "users,executions"

registry:
  enabled: false
admin:
  enabled: false
control:
  enabled: false
gateway:
  enabled: false

# Bundled in-cluster Postgres from the ECR-mirrored official image (the
# marketplace-mirror workflow pushes it). registry/repository/tag are split
# in AWS's recommended values.yaml format — their chart validator composes
# `<registry>/<repository>:<tag>` from these exact keys, and an empty
# registry with the full path in repository breaks its parser (leading-`/`,
# missing tag → INVALID_HELM_UNDECLARED_IMAGES / MISSING_VALUES_IMAGE_REFERENCE).
# The first-party subchart's passwords come from the generated app-secrets
# Secret (global.appSecrets above); set postgresql.auth.password explicitly
# only to override.
postgresql:
  enabled: true
  image:
    registry: "709825985650.dkr.ecr.us-east-1.amazonaws.com"
    repository: "jentic/jentic-one-psql"
    # The Alpine mirror (deploy/docker/postgres-mirror.Dockerfile) — Alpine
    # because AWS's scanner blocks on Debian's won't-fix glibc CVEs; the
    # mirror workflow pushes the tag it reads from that Dockerfile's FROM pin.
    tag: "17.11-alpine"
