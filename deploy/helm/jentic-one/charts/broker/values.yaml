image:
  repository: jentic-one/broker
  tag: ""

replicas: 1

# The memory limit holds the ~130Mi process baseline plus the default memory
# shared-state backend's 192 MiB cap
# (broker.resilience.backend.memory.max_total_bytes), with headroom. Raise it
# together with those budgets. See "Scaling and HA" in docs/installation/helm.md.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthCheck:
  path: /health
  port: 8000

service:
  type: ClusterIP
  port: 8000

# Extra environment variables injected into the broker container as name/value
# pairs. Used (e.g.) to point the HuggingFace / sentence-transformers cache at a
# writable path, since the container runs as a non-root user whose $HOME does
# not exist.
#
# JENTIC__SERVER__WORKERS runs several uvicorn worker processes per pod. A
# broker refuses it on the default memory shared-state backend (Idempotency-Key
# claims, rate limits and breaker counters would split across workers), and the
# published image lacks the [redis] extra the redis backend needs. On that image
# it therefore works only with idempotency, rate limiting and the circuit
# breaker disabled; otherwise build an image with jentic-one[redis] and set the
# redis backend. Raise resources.limits.cpu AND resources.limits.memory roughly
# N times (512Mi fits one worker). See "Scaling and HA" in
# docs/installation/helm.md.
#   extraEnv:
#     JENTIC__SERVER__WORKERS: "2"
#     JENTIC__BROKER__RESILIENCE__BACKEND__BACKEND: redis
#     JENTIC__BROKER__RESILIENCE__BACKEND__REDIS_URL: redis://redis:6379/0
extraEnv: {}

# Hardened by default, per docs/security/README.md. Both blocks are values so a
# cluster whose policy disagrees can relax them without patching templates.
# runAsUser pairs with `USER 10001` in deploy/docker/*.Dockerfile, and
# readOnlyRootFilesystem with the /tmp emptyDir the deployment mounts — see
# charts/common/templates/_security-context.tpl before changing either.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
