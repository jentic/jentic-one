image:
  repository: jentic-one/registry
  tag: ""

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

healthCheck:
  path: /health
  port: 8000

service:
  type: ClusterIP
  port: 8000

# Extra environment variables injected into the registry container as name/value
# pairs. Used (e.g.) to point the HuggingFace / sentence-transformers cache at a
# writable path, since the container runs as a non-root user whose $HOME does
# not exist.
extraEnv: {}

# Hardened by default, per docs/security/README.md. Both blocks are values so a
# cluster whose policy disagrees can relax them without patching templates.
# runAsUser pairs with `USER 10001` in deploy/docker/*.Dockerfile, and
# readOnlyRootFilesystem with the /tmp emptyDir the deployment mounts — see
# charts/common/templates/_security-context.tpl before changing either.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# readOnlyRootFilesystem is safe for the default search path, which is lexical
# and loads no model files. A deployment that registers a semantic/vector search
# strategy fetches models at runtime and needs a writable cache — point it at a
# mounted volume via extraEnv, or set
# `securityContext.readOnlyRootFilesystem: false`.
