# Defaults for the bundled single-instance PostgreSQL. The umbrella chart's
# `postgresql:` block (deploy/helm/jentic-one/values.yaml) overlays these —
# keep the two in sync when adding keys.

image:
  registry: docker.io
  # For registries that embed a namespace (e.g. the AWS Marketplace mirror),
  # keep the split form — registry "709825985650.dkr.ecr.us-east-1.amazonaws.com",
  # repository "jentic/one-psql". (Do NOT blank the registry and stuff
  # the full path into repository: Helm renders it fine, but AWS Marketplace's
  # chart validator composes refs from these exact keys and chokes on an
  # empty registry.)
  repository: postgres
  # Self-hosters get the official Debian-based image. The AWS Marketplace
  # overlay pins the hardened Alpine mirror instead
  # (deploy/docker/postgres-mirror.Dockerfile; Dependabot keeps its digest
  # pin fresh).
  tag: "17.11"

auth:
  username: postgres
  # No default password — the chart refuses to install without one (same
  # posture as global.databases passwords; dev files: deploy/helm/values/
  # local-*.yaml) UNLESS global.appSecrets is active, in which case the
  # superuser password comes from the generated Secret via secretKeyRef..
  database: jentic

primary:
  initdb:
    # ConfigMap with *.sql scripts mounted at /docker-entrypoint-initdb.d
    # (they run once, on first boot with an empty data dir). Empty means the
    # umbrella chart's auto-created init ConfigMap (<release>-pg-init, see
    # templates/pg-init-configmap.yaml in the umbrella chart).
    scriptsConfigMap: ""

# Raised from the image's default of 100, which the chart's own topologies
# exceed: every surface opens a pool per database (databases.*.pool_max
# defaults to 10, three databases), so each process can hold ~30 connections.
# Combined mode (app + broker) reaches ~60, and parts mode (registry + admin +
# control + broker) ~120 — over the default before any replica is added or the
# migration Job connects.
#
# 200 covers parts mode with headroom for the migrate hook and a second replica.
# It is also why the memory limit below is 2Gi: each backend costs a few MB of
# private memory on top of shared_buffers, so a full 200 needs more than the
# 1Gi that suffices at 100. Raise both together, or neither.
#
# A managed database with a connection pooler is still the production answer —
# see docs/installation/helm.md.
maxConnections: 200

persistence:
  enabled: true
  size: 8Gi
  # Empty = the cluster's default StorageClass.
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    # Sized for maxConnections above — see the arithmetic there.
    memory: 2Gi
