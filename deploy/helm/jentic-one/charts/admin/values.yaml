image:
  repository: jentic-one/admin
  tag: ""

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

healthCheck:
  path: /health
  port: 8000

service:
  type: ClusterIP
  port: 8000

# Hardened by default, per docs/security/README.md. Both blocks are values so a
# cluster whose policy disagrees can relax them without patching templates.
# runAsUser pairs with `USER 10001` in deploy/docker/*.Dockerfile, and
# readOnlyRootFilesystem with the /tmp emptyDir the deployment mounts — see
# charts/common/templates/_security-context.tpl before changing either.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
