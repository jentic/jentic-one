apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "common.pod-annotations" . | nindent 6 }}
    spec:
      {{- include "common.pod-security-context" . | nindent 6 }}
      containers:
        - name: admin
          image: {{ include "common.image" . | quote }}
          {{- include "common.container-security-context" . | nindent 10 }}
          ports:
            - containerPort: 8000
          env:
{{ include "common.config-file.env" . | indent 12 }}
{{ include "common.app-secrets.env" . | indent 12 }}
{{ include "common.runtime-env" . | indent 12 }}
{{ include "common.logging-env" . | indent 12 }}
{{ include "common.metrics-env" . | indent 12 }}
{{ include "common.db-env" . | indent 12 }}
{{- /* extraEnv goes LAST so the operator wins on duplicate keys — see common.extra-env. */}}
{{ include "common.extra-env" . | indent 12 }}
{{- $cfgMount := (include "common.config-file.mount" . | trim) }}
{{- $encMount := (include "common.app-secrets.mount" . | trim) }}
{{- $tmpMount := (include "common.tmp-volume-mount" . | trim) }}
{{- if or $cfgMount $encMount $tmpMount }}
          volumeMounts:
{{- with $tmpMount }}
{{ . | indent 12 }}
{{- end }}
{{- with $cfgMount }}
{{ . | indent 12 }}
{{- end }}
{{- with $encMount }}
{{ . | indent 12 }}
{{- end }}
{{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.healthCheck.port | default 8000 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.healthCheck.port | default 8000 }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.global.observability.otel.enabled }}
{{ include "common.otel-sidecar" . | indent 8 }}
        {{- end }}
      {{- $otel := .Values.global.observability.otel.enabled }}
      {{- $cfg := (include "common.config-file.volume" . | trim) }}
      {{- $enc := (include "common.app-secrets.volume" . | trim) }}
      {{- $tmp := (include "common.tmp-volume" . | trim) }}
      {{- if or $otel $cfg $enc $tmp }}
      volumes:
      {{- with $tmp }}
{{ . | indent 8 }}
      {{- end }}
      {{- if $otel }}
{{ include "common.otel-config-volume" . | indent 8 }}
      {{- end }}
      {{- with $cfg }}
{{ . | indent 8 }}
      {{- end }}
      {{- with $enc }}
{{ . | indent 8 }}
      {{- end }}
      {{- end }}
