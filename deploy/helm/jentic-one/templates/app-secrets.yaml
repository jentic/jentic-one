{{- /*
Release-scoped application secrets Secret.

Holds every generated scalar secret the app cannot safely default, one key per
concern so each surface is handed only what it reads (charts/common's
_app-secrets.tpl maps surfaces to keys):

  credentials-encryption.yaml -- `credentials.encryption`, the AES-256-GCM
                              keyset for credential-at-rest. List-shaped, so
                              flat JENTIC__* env vars cannot carry it; mounted
                              as JENTIC_CONFIG_FILE (app, admin, control,
                              broker). Every credential write 500s without it.
  admin-jwt-secret         -- admin.auth.jwt_secret: signs admin/session JWTs
                              (app, admin) and verifies them (control,
                              registry). JENTIC_ENV=production refuses an
                              empty or placeholder value on those surfaces.
  admin-invite-pepper      -- admin.invite.pepper: peppers invite-token hashes
                              (app, admin).
  connect-state-secret     -- credentials.connect.state_secret: signs the
                              OAuth connect `state` (app, control).
  config.yaml              -- LEGACY: all four of the above in one config
                              document, the only layout older chart versions
                              wrote. Kept in sync with the per-concern keys on
                              every render (direction below), so
                              global.appSecrets.layout=single and a rollback
                              to an older chart read the same values; not
                              mounted in the default split layout.

plus one individual key per database password, consumed via secretKeyRef
(common.db-env for the service pods, the postgresql subchart's StatefulSet
for the server + init script):

  db-password-registry / -control / -admin -- per-surface role passwords
  db-password-postgres                     -- bundled-DB superuser password

For the BUNDLED in-cluster Postgres these passwords are pure pod-to-pod
wiring on a ClusterIP service no one outside the cluster can reach — a
generated random value is strictly better than anything an operator types
into a form. Deployments using an EXTERNAL database instead set
global.databases.*.password explicitly, which always wins over these keys
(see common.db-env).

One release-scoped Secret rather than per-pod: the surfaces that share a
secret must agree on it (the broker re-encrypts refreshed tokens control must
read back; JWTs issued by admin are verified by control and registry; the DB
roles are created by the Postgres init script with the same passwords the pods
log in with). Per-surface isolation comes from which keys each pod references.

Modes, driven by global.appSecrets:

  generate: true     -> this Secret is created with fresh random values on
                        first install and REUSED VERBATIM on every upgrade
                        (lookup) -- regenerating would render all previously
                        encrypted credentials undecryptable and revoke every
                        live session. An upgrade from a chart version that
                        only wrote config.yaml derives the per-concern keys
                        FROM it (same values, no rotation); with
                        layout=split, config.yaml is then rewritten from the
                        per-concern keys, with layout=single it stays the
                        source they follow. "helm.sh/
                        resource-policy": keep survives uninstall for the
                        same reason (the Postgres PVC survives too); a
                        same-name reinstall re-adopts it.
  existingSecret set -> nothing rendered here; pods mount the named Secret
                        (per-concern keys with layout=split, or the legacy
                        config.yaml key with the default layout=single).
  neither            -> nothing rendered or mounted (dev overlays supply
                        secrets via configFile.contents instead).

Offline renders (helm template/lint -- e.g. AWS Marketplace validation) have
no cluster to look up, so they emit throwaway random values; that manifest
is valid but must not be kubectl-applied twice -- `helm install` is the
supported path (same caveat as common.require-install).
*/ -}}
{{- $sec := .Values.global.appSecrets | default dict }}
{{- if and $sec.generate (not $sec.existingSecret) }}
{{- $name := printf "%s-app-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- /* Reuse each key that already exists; generate only what's missing (an
upgrade from a chart version that generated fewer keys fills the gaps
without touching the ones in use). Nothing already in use is ever rotated.

The per-concern keys and the legacy config.yaml carry the same four values;
which side is authoritative follows the layout the pods actually read:
  split  -> per-concern key > legacy config.yaml > fresh random, and
            config.yaml is rewritten from the result (so a rollback to an
            older chart, which reads only config.yaml, sees the values the
            pods were using -- including a keyset edited in place).
  single -> legacy config.yaml > per-concern key > fresh random, and
            config.yaml is kept verbatim (it may hold hand-added settings);
            the per-concern keys follow it, so a later switch to split
            carries the same values. */}}
{{- $layout := $sec.layout | default "split" }}
{{- $legacy := dict }}
{{- if hasKey $data "config.yaml" }}
{{- $legacy = index $data "config.yaml" | b64dec | fromYaml | default dict }}
{{- end }}
{{- $lcred := get $legacy "credentials" | default dict }}
{{- $ladmin := get $legacy "admin" | default dict }}
{{- if eq $layout "split" }}
{{- /* In split mode the legacy document may only carry the four
chart-generated secrets: anything else in it (hand-added config) would
silently stop reaching the pods, which no longer mount it. Checked on every
split render, not only the first one, so a release that ran layout=single
(which writes the per-concern keys too) cannot later drop back to split and
lose those settings without a word. */}}
{{- $extras := list }}
{{- range $k, $_ := $legacy }}{{- if not (has $k (list "credentials" "admin")) }}{{- $extras = append $extras $k }}{{- end }}{{- end }}
{{- range $k, $_ := $lcred }}{{- if not (has $k (list "encryption" "connect")) }}{{- $extras = append $extras (printf "credentials.%s" $k) }}{{- end }}{{- end }}
{{- range $k, $_ := (get $lcred "connect" | default dict) }}{{- if ne $k "state_secret" }}{{- $extras = append $extras (printf "credentials.connect.%s" $k) }}{{- end }}{{- end }}
{{- range $k, $_ := $ladmin }}{{- if not (has $k (list "auth" "invite")) }}{{- $extras = append $extras (printf "admin.%s" $k) }}{{- end }}{{- end }}
{{- range $k, $_ := (get $ladmin "auth" | default dict) }}{{- if ne $k "jwt_secret" }}{{- $extras = append $extras (printf "admin.auth.%s" $k) }}{{- end }}{{- end }}
{{- range $k, $_ := (get $ladmin "invite" | default dict) }}{{- if ne $k "pepper" }}{{- $extras = append $extras (printf "admin.invite.%s" $k) }}{{- end }}{{- end }}
{{- if $extras }}
{{- fail (printf "the existing %s Secret's config.yaml carries settings beyond the chart-generated secrets (%s); the split layout would stop mounting them. Set global.appSecrets.layout=single to keep the legacy single-file mount, or move those settings to extraEnv and delete them from the Secret's config.yaml first" $name (join ", " $extras)) }}
{{- end }}
{{- end }}
{{- /* Each concern's value from the legacy document ("" when absent). */}}
{{- $legacyEnc := "" }}
{{- if hasKey $lcred "encryption" }}{{- $legacyEnc = dict "credentials" (dict "encryption" (get $lcred "encryption")) | toYaml }}{{- end }}
{{- $legacyJwt := get (get $ladmin "auth" | default dict) "jwt_secret" | default "" | toString }}
{{- $legacyPepper := get (get $ladmin "invite" | default dict) "pepper" | default "" | toString }}
{{- $legacyState := get (get $lcred "connect" | default dict) "state_secret" | default "" | toString }}
{{- /* Each concern's value from its own key ("" when absent). */}}
{{- $keyEnc := "" }}{{- if hasKey $data "credentials-encryption.yaml" }}{{- $keyEnc = index $data "credentials-encryption.yaml" | b64dec }}{{- end }}
{{- $keyJwt := "" }}{{- if hasKey $data "admin-jwt-secret" }}{{- $keyJwt = index $data "admin-jwt-secret" | b64dec }}{{- end }}
{{- $keyPepper := "" }}{{- if hasKey $data "admin-invite-pepper" }}{{- $keyPepper = index $data "admin-invite-pepper" | b64dec }}{{- end }}
{{- $keyState := "" }}{{- if hasKey $data "connect-state-secret" }}{{- $keyState = index $data "connect-state-secret" | b64dec }}{{- end }}
{{- $freshEnc := printf "credentials:\n  encryption:\n    active_id: v1\n    entries:\n      - id: v1\n        material: %s\n" (randBytes 32) }}
{{- $enc := "" }}{{- $jwt := "" }}{{- $pepper := "" }}{{- $state := "" }}
{{- if eq $layout "single" }}
{{- $enc = coalesce $legacyEnc $keyEnc $freshEnc }}
{{- $jwt = coalesce $legacyJwt $keyJwt (randBytes 32) }}
{{- $pepper = coalesce $legacyPepper $keyPepper (randBytes 32) }}
{{- $state = coalesce $legacyState $keyState (randBytes 32) }}
{{- else }}
{{- $enc = coalesce $keyEnc $legacyEnc $freshEnc }}
{{- $jwt = coalesce $keyJwt $legacyJwt (randBytes 32) }}
{{- $pepper = coalesce $keyPepper $legacyPepper (randBytes 32) }}
{{- $state = coalesce $keyState $legacyState (randBytes 32) }}
{{- end }}
  credentials-encryption.yaml: {{ $enc | b64enc }}
  admin-jwt-secret: {{ $jwt | b64enc }}
  admin-invite-pepper: {{ $pepper | b64enc }}
  connect-state-secret: {{ $state | b64enc }}
{{- if and (eq $layout "single") (hasKey $data "config.yaml") }}
  config.yaml: {{ index $data "config.yaml" }}
{{- else }}
{{- $encDoc := $enc | fromYaml }}
{{- $composed := dict
  "credentials" (dict "encryption" $encDoc.credentials.encryption "connect" (dict "state_secret" $state))
  "admin" (dict "auth" (dict "jwt_secret" $jwt) "invite" (dict "pepper" $pepper)) }}
  config.yaml: {{ $composed | toYaml | b64enc }}
{{- end }}
{{- range $key := list "db-password-registry" "db-password-control" "db-password-admin" "db-password-postgres" }}
{{- if hasKey $data $key }}
  {{ $key }}: {{ index $data $key }}
{{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
{{- end }}
{{- end }}
{{- end }}
