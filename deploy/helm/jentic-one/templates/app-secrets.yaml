{{- /*
Release-scoped application secrets Secret.

Holds every generated scalar secret the app cannot safely default, as one
config.yaml mounted via JENTIC_CONFIG_FILE (see charts/common's
_app-secrets.tpl for the mount):

  credentials.encryption   -- AES-256-GCM keyset for credential-at-rest.
                              List-shaped, so flat JENTIC__* env vars cannot
                              carry it; every credential write 500s without it.
  admin.auth.jwt_secret    -- signs admin/session JWTs. The shipped default
                              is a public placeholder anyone could forge
                              tokens with; JENTIC_ENV=production refuses it.
  admin.invite.pepper      -- peppers invite-token hashes (same placeholder
                              problem).
  credentials.connect.state_secret -- signs the OAuth connect `state`.

One release-scoped Secret rather than per-pod: the app, broker, and control
pods must agree on all of these (the broker re-encrypts refreshed tokens the
app must read back; JWTs cross surfaces).

Modes, driven by global.appSecrets:

  generate: true     -> this Secret is created with fresh random values on
                        first install and REUSED VERBATIM on every upgrade
                        (lookup) -- regenerating would render all previously
                        encrypted credentials undecryptable and revoke every
                        live session. "helm.sh/resource-policy": keep
                        survives uninstall for the same reason (the Postgres
                        PVC survives too); a same-name reinstall re-adopts it.
  existingSecret set -> nothing rendered here; pods mount the named Secret
                        (must hold a config.yaml with the same shape).
  neither            -> nothing rendered or mounted (dev overlays supply
                        secrets via configFile.contents instead).

Offline renders (helm template/lint -- e.g. AWS Marketplace validation) have
no cluster to look up, so they emit throwaway random values; that manifest
is valid but must not be kubectl-applied twice -- `helm install` is the
supported path (same caveat as common.require-install).
*/ -}}
{{- $sec := .Values.global.appSecrets | default dict }}
{{- if and $sec.generate (not $sec.existingSecret) }}
{{- $name := printf "%s-app-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- if and $existing $existing.data }}
  config.yaml: {{ index $existing.data "config.yaml" }}
{{- else }}
{{- $material := randBytes 32 }}
{{- $jwt := randBytes 32 }}
{{- $pepper := randBytes 32 }}
{{- $state := randBytes 32 }}
  config.yaml: {{ printf "credentials:\n  encryption:\n    active_id: v1\n    entries:\n      - id: v1\n        material: %s\n  connect:\n    state_secret: %s\nadmin:\n  auth:\n    jwt_secret: %s\n  invite:\n    pepper: %s\n" $material $state $jwt $pepper | b64enc }}
{{- end }}
{{- end }}
