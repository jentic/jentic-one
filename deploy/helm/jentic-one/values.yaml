gateway:
  enabled: false

broker:
  enabled: false
  image:
    repository: jentic-one/broker
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

app:
  enabled: true
  image:
    repository: jentic-one/app
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  # The app boots at ~150Mi RSS and each concurrent password / client-secret
  # verification adds 64Mi (argon2id memory_cost=65536), so its floor is
  # higher than the other surfaces'.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

registry:
  enabled: false
  image:
    repository: jentic-one/registry
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

admin:
  enabled: false
  image:
    repository: jentic-one/admin
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  # Admin serves the password/login endpoints in parts mode; same argon2
  # arithmetic as the app (64Mi per concurrent verification).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

control:
  enabled: false
  image:
    repository: jentic-one/control
    tag: ""
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

global:
  # Runtime mode for every Python surface (JENTIC_ENV). `production` arms the
  # config loader's placeholder-secret guard: an empty or change-me admin JWT
  # secret / invite pepper / connect state secret is a hard boot error instead of
  # a random per-process value that breaks sessions across replicas and on every
  # restart. Default fail-closed, so an install missing its secrets stops with an
  # error naming the field rather than coming up subtly broken.
  #
  # Set `development` only where running without those secrets is intended — the
  # dev overlays in deploy/helm/values/local-*.yaml do exactly that. See
  # charts/common/templates/_runtime-env.tpl.
  jenticEnv: production
  image:
    # Tag injected by `make deploy-local` from scripts/version.sh (which reads
    # pyproject.toml). Empty here means "fall back to per-service image.tag,
    # then Chart.AppVersion, then 'latest'". Override at the CLI for ad-hoc:
    #   helm install ... --set global.image.tag=v0.1.0
    tag: ""
    # Optional registry prefix. When set, services without an explicit
    # `image.repository` override get `<registry>/<service-name>` automatically.
    registry: ""
  observability:
    otel:
      enabled: false
      image: otel/opentelemetry-collector-contrib:latest
      endpoint: ""
      samplingRatio: "1.0"
      tls:
        insecure: true
    logging:
      # Maps to the application's `runtime.log_level`
      # (JENTIC__RUNTIME__LOG_LEVEL). Empty = the application's own default
      # (INFO) and no env var rendered, which leaves `runtime.log_level` in a
      # mounted config file effective — env would otherwise outrank it.
      # There is no `format` key: the application has no log-format config
      # field, so the chart offers no knob for one.
      level: ""
    metrics:
      # NOTE: `otlp` needs a reachable collector — with `otel.enabled: false`
      # (the default above) the SDK logs an export failure every interval.
      # Set `none` if you don't run a collector, or enable the otel sidecar.
      exporter: otlp
  postgresql:
    enabled: false
  # Pod service account for the app and broker deployments. `name` — when
  # set, those pods run under this service account (on EKS typically an
  # IRSA-annotated account carrying the IAM role the AWS Marketplace
  # entitlement gate calls AWS with); empty means the namespace default and
  # zero rendered change. The Marketplace launch experience substitutes the
  # buyer-chosen account into `name` (delivery-option override parameter
  # with DefaultValue ${AWSMP_SERVICE_ACCOUNT}). `create` — set true for
  # manual installs to have the chart create the (un-annotated) account;
  # leave false when it's created out of band (EKS QuickLaunch creates it
  # with the IAM role attached — creating it here too would collide).
  serviceAccount:
    create: false
    name: ""
  # AWS Marketplace license secret (delivery-option override parameter with
  # DefaultValue ${AWSMP_LICENSE_SECRET}): when set, mounted read-only into
  # the app and broker pods at /var/run/secrets/aws-marketplace/license.
  # Reserved for AWS's license-file flows (e.g. EKS Anywhere); the
  # IRSA-based entitlement gate does not read it. Empty = nothing rendered.
  awsmp:
    licenseSecret: ""
  # Generated application secrets — every scalar secret the app cannot safely
  # default, minted once into a release-scoped Secret:
  #   config.yaml (mounted as JENTIC_CONFIG_FILE into app/broker/control):
  #     credentials.encryption          AES-256-GCM keyset (list-shaped config
  #                                     env vars can't carry; credential writes
  #                                     fail without it)
  #     admin.auth.jwt_secret           admin/session JWT signer
  #     admin.invite.pepper             invite-token hash pepper
  #     credentials.connect.state_secret OAuth connect state signer
  #   db-password-{registry,control,admin,postgres} (secretKeyRef env):
  #     bundled-DB role + superuser passwords — pure pod-to-pod wiring on a
  #     ClusterIP service, so generated values beat operator-invented ones.
  #     Explicit global.databases.*.password / postgresql.auth.password
  #     always win (external-DB deployments keep setting those).
  # `generate: true` creates the Secret with random values on first install
  # and reuses it verbatim on upgrades (rotating would orphan everything
  # already encrypted and revoke live sessions; the Secret is kept on
  # uninstall for the same reason). `existingSecret` mounts your own Secret
  # instead (must hold the same keys — see docs/installation/helm.md
  # "Secrets"). Both are
  # mutually exclusive with per-service `configFile.contents`, which the dev
  # overlays use to inline dev secrets.
  appSecrets:
    generate: false
    existingSecret: ""
  # Database credentials. `password` has NO default — the chart refuses to
  # install without one (see common.require-install; offline `helm template`
  # and `helm lint` render an inert REQUIRED-AT-INSTALL placeholder instead,
  # which AWS Marketplace's chart validation requires), so every deployment
  # states its credentials explicitly. Dev/kind values live in
  # deploy/helm/values/local-*.yaml. In production, do NOT put real passwords
  # in a values file: replace `common.db-env` in your subchart deployments
  # with a Secret-backed `valueFrom: secretKeyRef:` block, or pass an
  # `existingSecret` reference. See docs/installation/helm.md "Secrets".
  databases:
    registry:
      host: ""
      port: 5432
      name: jentic
      user: registry_user
      schema: registry
    control:
      host: ""
      port: 5432
      name: jentic
      user: control_user
      schema: control
    admin:
      host: ""
      port: 5432
      name: jentic
      user: admin_user
      schema: admin

postgresql:
  enabled: false
  # First-party subchart (charts/postgresql) on the official library/postgres
  # image — the former Bitnami dependency pinned the frozen `bitnamilegacy`
  # image (no CVE fixes since Aug 2025), which the Trivy publish gate and the
  # AWS Marketplace scan both reject. Dev/eval-grade single instance;
  # production should use a managed database (docs/installation/helm.md).
  image:
    registry: docker.io
    repository: postgres
    tag: "17.11"
  auth:
    username: postgres
    # No default password — set one in your values file (dev files:
    # deploy/helm/values/local-*.yaml).
    database: jentic
  primary:
    initdb:
      # Empty = the umbrella chart's auto-created <release>-pg-init ConfigMap
      # (templates/pg-init-configmap.yaml) — per-surface schemas, roles and
      # grants derived from global.databases.
      scriptsConfigMap: ""
  # Above the image's default of 100, which every mode of this chart exceeds:
  # each surface holds a pool per database (databases.*.pool_max defaults to 10,
  # three databases). Parts mode reaches ~120 before replicas. The subchart's
  # values.yaml carries the full arithmetic, and pairs this with a 2Gi memory
  # limit — raise both together.
  maxConnections: 200

# The migration hook Job (templates/migrate-job.yaml).
migrate:
  # Extra arguments for `python -m jentic_one.migrations.run`. The escape hatch
  # for a post-migration upgrade step that blocks an upgrade, e.g.
  #   ["--skip-upgrade-step", "<step-name>"]
  # defers that step to the next upgrade (docs/operations/upgrades.md). Leave
  # empty in normal operation.
  extraArgs: []

# Cluster-shaping resources. All three are off by default: turning any of them
# on changes what an existing release creates, and each needs cluster facts the
# chart has no way to discover (ingress class, controller namespace, replica
# counts). See templates/{ingress,poddisruptionbudget,networkpolicy}.yaml for the
# reasoning behind each default and docs/installation/helm.md for worked
# examples.
ingress:
  enabled: false
  # Leave empty for the cluster's default IngressClass.
  className: ""
  # Controller-specific settings go here (cert-manager issuer, body size,
  # request timeouts for the broker's long-running proxied calls, …).
  annotations: {}
  # Required when enabled. Each path routes to the release's HTTP entry point —
  # the gateway service in parts mode, the app service in combined mode — unless
  # it names its own `service` (a subchart name: app, admin, registry, control,
  # broker, gateway) and `port`. A host with no `paths` routes everything to that
  # entry point.
  #   hosts:
  #     - host: jentic.example.com
  #     - host: broker.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #           service: broker
  hosts: []
  # Standard Ingress TLS list: [{secretName: …, hosts: [...]}].
  tls: []
  # An Ingress puts a proxy in front of the OAuth rate limiters, so the chart
  # refuses to install until the enabled auth-serving surfaces know which proxy
  # IPs to trust. Set this only if rate limiting is enforced upstream of the
  # cluster.
  skipTrustedProxiesCheck: false

podDisruptionBudget:
  # Only useful above `replicas: 1` — at one replica a budget blocks node drains
  # instead of protecting availability.
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the surfaces on port 8000, matched on the
  # built-in `kubernetes.io/metadata.name` label — typically the ingress
  # controller's namespace, plus a monitoring namespace if it scrapes directly.
  allowFromNamespaces: []
  # Raw NetworkPolicy ingress/egress rules appended to the generated ones, for
  # sources the two lists above cannot express.
  extraIngress: []
  # Egress restriction is deliberately separate from `enabled`: the broker
  # proxies to arbitrary third-party APIs, so it is always exempt, and the other
  # surfaces need `extraEgress` entries for anything off-cluster (an external
  # database, an OIDC issuer, an OTLP endpoint).
  restrictEgress: false
  extraEgress: []
