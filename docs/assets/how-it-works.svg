<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">How Jentic One brokers an agent's API calls</title>
  <desc id="d">An agent sends POST /v1/invoices to Jentic One. Jentic One checks the agent's permission (allowed), injects the stored credential, forwards the call to the Stripe API, which returns 201, and records the call. The agent then sends POST /v1/refunds; the permission check denies it by rule, the request never leaves Jentic One, and the denial is recorded. The agent never sees the API key.</desc>
  <style>
    .bg{fill:#0d181b}
    .frame{fill:none;stroke:#26393e;stroke-width:1.5}
    .box{fill:#111f23;stroke:#2c4247;stroke-width:1.5}
    .brk{fill:#111f23;stroke:#f5a524;stroke-width:1.5}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .h{font-size:15px;fill:#f2f6f6;font-weight:600}
    .s{font-size:12px;fill:#8aa0a3}
    .k{font-size:12px;fill:#f5a524;letter-spacing:.08em}
    .row{font-size:13px;fill:#c9d4d6}
    .log{font-size:13px}
    .ok{fill:#5edeb9}.no{fill:#f2707a}.key{fill:#f5a524}.dim{fill:#8aa0a3}
    .wire{stroke:#2c4247;stroke-width:2;fill:none}
    .pill{rx:10;ry:10}
    .a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;opacity:0}
    /* request A: POST /v1/invoices */
    .lblA{animation-name:lblA}   @keyframes lblA{0%,2%{opacity:0}4%,12%{opacity:1}15%,100%{opacity:0}}
    .dotA1{animation-name:dotA1} @keyframes dotA1{0%,2%{opacity:0;transform:translateX(0)}3%{opacity:1}11%{opacity:1;transform:translateX(142px)}12%,100%{opacity:0;transform:translateX(142px)}}
    .okA{animation-name:okA}     @keyframes okA{0%,11%{opacity:0}13%,44%{opacity:1}47%,100%{opacity:0}}
    .keyA{animation-name:keyA}   @keyframes keyA{0%,16%{opacity:0}18%,44%{opacity:1}47%,100%{opacity:0}}
    .dotA2{animation-name:dotA2} @keyframes dotA2{0%,19%{opacity:0;transform:translateX(0)}20%{opacity:1}28%{opacity:1;transform:translateX(98px)}29%,100%{opacity:0;transform:translateX(98px)}}
    .apiA{animation-name:apiA}   @keyframes apiA{0%,28%{opacity:0}30%,36%{opacity:1}40%,100%{opacity:0}}
    .gotA{animation-name:gotA}   @keyframes gotA{0%,34%{opacity:0}36%,44%{opacity:1}47%,100%{opacity:0}}
    .logA{animation-name:logA}   @keyframes logA{0%,40%{opacity:0}43%,95%{opacity:1}99%,100%{opacity:0}}
    .recA{animation-name:recA}   @keyframes recA{0%,40%{opacity:0}42%,44%{opacity:1}47%,100%{opacity:0}}
    /* request B: POST /v1/refunds */
    .lblB{animation-name:lblB}   @keyframes lblB{0%,50%{opacity:0}52%,61%{opacity:1}64%,100%{opacity:0}}
    .dotB{animation-name:dotB}   @keyframes dotB{0%,50%{opacity:0;transform:translateX(0)}51%{opacity:1}59%{opacity:1;transform:translateX(142px)}60%,100%{opacity:0;transform:translateX(142px)}}
    .noB{animation-name:noB}     @keyframes noB{0%,59%{opacity:0}61%,93%{opacity:1}96%,100%{opacity:0}}
    .flashB{animation-name:flashB} @keyframes flashB{0%,59%{opacity:0}61%{opacity:1}68%,100%{opacity:0}}
    .stopB{animation-name:stopB} @keyframes stopB{0%,60%{opacity:0}63%,93%{opacity:1}96%,100%{opacity:0}}
    .recB{animation-name:recB}   @keyframes recB{0%,63%{opacity:0}65%,93%{opacity:1}96%,100%{opacity:0}}
    .logB{animation-name:logB}   @keyframes logB{0%,64%{opacity:0}67%,95%{opacity:1}99%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .a{animation:none}
      .logA,.logB,.noB,.stopB,.recB{opacity:1}
    }
  </style>

  <rect class="bg" x="0" y="0" width="880" height="400" rx="14"/>
  <rect class="frame" x="1" y="1" width="878" height="398" rx="14"/>
  <text class="mono k" x="28" y="36">HOW IT WORKS</text>
  <text class="mono s" x="148" y="36">every call checked · every key stays on your side</text>
  <line x1="1" y1="54" x2="879" y2="54" stroke="#26393e" stroke-width="1.5"/>

  <!-- agent -->
  <rect class="box" x="28" y="96" width="170" height="130" rx="10"/>
  <text class="mono h" x="48" y="128">your agent</text>
  <text class="mono s" x="48" y="152">Claude Code, Cursor,</text>
  <text class="mono s" x="48" y="170">Codex, your own…</text>
  <text class="mono s" x="48" y="206">holds no API keys</text>
  <rect class="a gotA" x="28" y="96" width="170" height="130" rx="10" fill="none" stroke="#5edeb9" stroke-width="3"/>
  <rect class="a gotA" x="40" y="190" width="150" height="24" fill="#111f23"/>
  <text class="a gotA mono ok" x="48" y="206" font-size="12">got 201 ✓</text>

  <!-- Jentic One -->
  <rect class="brk" x="340" y="76" width="270" height="170" rx="10"/>
  <text class="mono h" x="360" y="106">Jentic One</text>
  <text class="mono s" x="360" y="124">on your infrastructure</text>
  <text class="mono row" x="360" y="160">1  check permission</text>
  <text class="mono row" x="360" y="190">2  inject credential</text>
  <text class="mono row" x="360" y="220">3  record the call</text>
  <rect class="a flashB" x="340" y="76" width="270" height="170" rx="10" fill="none" stroke="#f2707a" stroke-width="3"/>

  <!-- API -->
  <rect class="box" x="708" y="96" width="144" height="130" rx="10"/>
  <text class="mono h" x="728" y="128">Stripe API</text>
  <text class="mono s" x="728" y="152">or any public /</text>
  <text class="mono s" x="728" y="170">private API</text>
  <rect class="a apiA" x="708" y="96" width="144" height="130" rx="10" fill="none" stroke="#5edeb9" stroke-width="3"/>
  <text class="a apiA mono ok" x="728" y="206" font-size="13">201 Created</text>

  <!-- wires -->
  <line class="wire" x1="198" y1="161" x2="340" y2="161"/>
  <line class="wire" x1="610" y1="161" x2="708" y2="161"/>

  <!-- request A -->
  <text class="a lblA mono row" x="269" y="146" text-anchor="middle" font-size="12">POST /v1/invoices</text>
  <circle class="a dotA1" cx="198" cy="161" r="6" fill="#c9d4d6"/>
  <g class="a okA"><text class="mono ok" x="596" y="160" font-size="12" text-anchor="end">allowed ✓</text></g>
  <text class="a keyA mono key" x="596" y="190" font-size="12" text-anchor="end">key added</text>
  <circle class="a dotA2" cx="610" cy="161" r="6" fill="#f5a524"/>
  <text class="a recA mono ok" x="596" y="220" font-size="12" text-anchor="end">logged</text>

  <!-- request B -->
  <text class="a lblB mono row" x="269" y="146" text-anchor="middle" font-size="12">POST /v1/refunds</text>
  <circle class="a dotB" cx="198" cy="161" r="6" fill="#c9d4d6"/>
  <text class="a noB mono no" x="596" y="160" font-size="12" text-anchor="end">denied ✕</text>
  <g class="a stopB">
    <text class="mono no" x="659" y="146" font-size="12" text-anchor="middle">never sent</text>
    <line x1="610" y1="161" x2="708" y2="161" stroke="#f2707a" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <text class="a recB mono ok" x="596" y="220" font-size="12" text-anchor="end">logged</text>

  <!-- execution log -->
  <line x1="28" y1="282" x2="852" y2="282" stroke="#26393e" stroke-width="1.5"/>
  <text class="mono k" x="28" y="306">EXECUTION LOG</text>
  <text class="a logA mono log" x="28" y="336"><tspan class="ok">✓</tspan><tspan class="dim" dx="10">agent_billing</tspan><tspan fill="#c9d4d6" dx="12">POST /v1/invoices</tspan><tspan class="dim" dx="12">→ stripe</tspan><tspan class="ok" dx="12">201</tspan><tspan class="dim" dx="12">842 ms</tspan></text>
  <text class="a logB mono log" x="28" y="364"><tspan class="no">✕</tspan><tspan class="dim" dx="10">agent_billing</tspan><tspan fill="#c9d4d6" dx="12">POST /v1/refunds</tspan><tspan class="no" dx="13">denied by rule</tspan><tspan class="dim" dx="12">· never left Jentic One</tspan></text>
</svg>
