<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d">
  <title id="t">Jentic One architecture</title>
  <desc id="d">Two units over one database. The operator uses App, the control plane, which contains the Registry, Control, Admin and Auth surfaces and is where APIs are registered, credentials stored and agents approved. The agent calls the Broker, the data plane, which checks permissions, injects the credential and forwards the call to upstream APIs. Both App and the Broker sit above one PostgreSQL or SQLite database with registry, control and admin schemas.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .h{font-size:16px;fill:#f2f6f6;font-weight:600}
    .s{font-size:12px;fill:#8aa0a3}
    .t{font-size:13px;fill:#c9d4d6}
    .k{font-size:12px;fill:#f5a524;letter-spacing:.08em}
    .amb{font-size:12px;fill:#f5a524}
    .box{fill:#111f23;stroke:#2c4247;stroke-width:1.5}
    .chip{fill:#0d181b;stroke:#2c4247;stroke-width:1.2}
    .brk{fill:#111f23;stroke:#f5a524;stroke-width:1.5}
    .wire{stroke:#4a6166;stroke-width:1.5;fill:none}
    .hot{stroke:#f5a524;stroke-width:2;fill:none}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a6166"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/></marker>
  </defs>

  <rect x="0" y="0" width="880" height="430" rx="14" fill="#0d181b"/>
  <rect x="1" y="1" width="878" height="428" rx="14" fill="none" stroke="#26393e" stroke-width="1.5"/>
  <text class="mono k" x="28" y="36">ARCHITECTURE</text>
  <text class="mono s" x="148" y="36">two units · one database · your infrastructure</text>
  <line x1="1" y1="54" x2="879" y2="54" stroke="#26393e" stroke-width="1.5"/>

  <!-- actors -->
  <text class="mono t" x="40" y="88">you, the operator</text>
  <line class="wire" x1="110" y1="96" x2="110" y2="118" marker-end="url(#ar)"/>
  <text class="mono amb" x="470" y="88">your agent</text>
  <line class="hot" x1="508" y1="96" x2="508" y2="118" marker-end="url(#aa)"/>

  <!-- App -->
  <rect class="box" x="28" y="122" width="400" height="160" rx="10"/>
  <text class="mono h" x="48" y="152">App</text>
  <text class="mono s" x="92" y="152">control plane</text>
  <rect class="chip" x="48" y="168" width="84" height="32" rx="6"/><text class="mono t" x="90" y="189" text-anchor="middle">Registry</text>
  <rect class="chip" x="142" y="168" width="84" height="32" rx="6"/><text class="mono t" x="184" y="189" text-anchor="middle">Control</text>
  <rect class="chip" x="236" y="168" width="84" height="32" rx="6"/><text class="mono t" x="278" y="189" text-anchor="middle">Admin</text>
  <rect class="chip" x="330" y="168" width="78" height="32" rx="6"/><text class="mono t" x="369" y="189" text-anchor="middle">Auth</text>
  <text class="mono s" x="48" y="230">register APIs · store credentials</text>
  <text class="mono s" x="48" y="250">approve agents · UI and admin APIs</text>

  <!-- Broker -->
  <rect class="brk" x="458" y="122" width="230" height="160" rx="10"/>
  <text class="mono h" x="478" y="152">Broker</text>
  <text class="mono s" x="544" y="152">data plane</text>
  <text class="mono t" x="478" y="190">1 check permission</text>
  <text class="mono t" x="478" y="214">2 inject credential</text>
  <text class="mono t" x="478" y="238">3 forward + record</text>

  <!-- upstream -->
  <line class="hot" x1="688" y1="202" x2="722" y2="202" marker-end="url(#aa)"/>
  <rect class="box" x="726" y="152" width="126" height="100" rx="10"/>
  <text class="mono h" x="742" y="184">APIs</text>
  <text class="mono s" x="742" y="208">public or</text>
  <text class="mono s" x="742" y="226">private</text>

  <!-- database -->
  <line class="wire" x1="228" y1="282" x2="228" y2="316"/>
  <line class="wire" x1="573" y1="282" x2="573" y2="316"/>
  <rect class="box" x="28" y="316" width="660" height="52" rx="10"/>
  <text class="mono h" x="48" y="348" font-size="15">PostgreSQL or SQLite</text>
  <text class="mono s" x="668" y="347" text-anchor="end">registry · control · admin</text>

  <text class="mono s" x="28" y="404">Run both on one host, or put the Broker in the network that can reach your APIs.</text>
</svg>
