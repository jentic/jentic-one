# Upgrade-test policy for CI and release gating.
# Validated by tests/unit/test_supported_upgrades.py (via tests/upgrade/matrix.py)
# and consumed by the upgrade-matrix job in .github/workflows/ci.yml.
#
# This file holds policy only. The concrete source releases are derived at run
# time from the repository's v* git tags and the pyproject.toml version, and
# each source image is pulled by the digest GHCR reports for its tag, so the
# window rolls forward on every release without editing this file.
#
# Policy:
# - Support window covers the previous two minor releases (N-1 and N-2), each
#   collapsed to its latest published patch tag.
# - enabled_roles lists the window roles that run as CI legs.
# - Refresh tokens issued on a supported source version must either continue to
#   refresh after upgrade or be explicitly documented as revoked in
#   docs/operations/upgrade-notes.md.
# - Any intentionally broken source path within the window must be recorded in
#   known_breaks with a non-empty reason, a valid link to an existing heading
#   in docs/operations/upgrade-notes.md, and a YYYY-MM-DD expires date. Until
#   it expires, a failing leg for that source is reported as a warning; after
#   it expires the leg gates again.

window:
  minors_back: 2
  collapse_patches: latest
  enabled_roles: ["n-1"]

refresh_token_policy: survive_unless_documented_in_upgrade_notes

backends:
  - name: "postgres"
    blocking: true
    enabled: true
  - name: "sqlite"
    blocking: false
    enabled: false

known_breaks: []
