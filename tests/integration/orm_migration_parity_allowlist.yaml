# Allowlist of known ORM-metadata vs migrated-schema differences.
# Every entry must specify: backend, surface, op, table, name, and reason.
# The ratchet test (test_parity_allowlist_entries_are_still_needed) fails when
# any entry no longer matches an observed difference on its backend/surface.
entries:
  # ---------------------------------------------------------------------------
  # sqlite / registry (7 benign dialect differences)
  # ---------------------------------------------------------------------------
  - backend: sqlite
    surface: registry
    op: add_index
    table: operations
    name: ix_operations_tags
    reason: >-
      Benign dialect difference: Operation.__table_args__ declares the GIN index
      ix_operations_tags on tags, which migration a1b2c3d4e5f6 creates only on
      PostgreSQL because SQLite stores tags as JSON text rather than ARRAY.
  - backend: sqlite
    surface: registry
    op: remove_table
    table: operations_fts
    name: operations_fts
    reason: >-
      Benign dialect difference: SQLite FTS5 virtual table created via raw SQL in
      migration c2d3e4f5a6b7_add_lexical_search_text.py and intentionally not
      mapped as a SQLAlchemy ORM model.
  - backend: sqlite
    surface: registry
    op: remove_table
    table: operations_fts_config
    name: operations_fts_config
    reason: >-
      Benign dialect difference: SQLite FTS5 internal shadow table backing
      operations_fts (created by migration c2d3e4f5a6b7).
  - backend: sqlite
    surface: registry
    op: remove_table
    table: operations_fts_content
    name: operations_fts_content
    reason: >-
      Benign dialect difference: SQLite FTS5 internal shadow table backing
      operations_fts (created by migration c2d3e4f5a6b7).
  - backend: sqlite
