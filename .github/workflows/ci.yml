name: CI

on:
  push:
    # Trunk CI only. Do NOT add `cli-v2-*` here: the stacked-PR chain gets full CI
    # via the pull_request trigger below, and adding the feature branches to `push`
    # too would fire a SECOND, redundant run per commit (and, because a push run
    # ignores the per-PR path filters, that run would cover the entire matrix).
    branches: [main]
  pull_request:
    # `main` for normal PRs; `cli-v2-*` so the CLI-V2 stacked-PR chain (each phase's
    # PR is based on the previous phase's branch, not main) still gets full CI.
    # GitHub reads this pull_request filter from the PR's BASE branch, so a PR based
    # on cli-v2-phase-0 only triggers this workflow if cli-v2-phase-0's own ci.yml
    # lists that base pattern here. Same for `feat/theme-5-*` (the theme-5
    # toolkit-removal stacked-PR chain), `feat/credentials-and-approvals-overhaul`
    # (the theme-7/theme-8 integration branch) and `feat/theme-8-*` (theme-8
    # PRs stacked on another theme-8 phase).
    branches:
      [
        main,
        'cli-v2-*',
        'feat/theme-5-*',
        'feat/credentials-and-approvals-overhaul',
        'feat/theme-8-*',
      ]
  # Merge queue: the queued run gates the merge on the true post-merge tree.
  # Inert until a merge queue is enabled in the main ruleset; behaves like a PR
  # run (path-filtered, PR tier).
  merge_group:
  # Nightly backstop: the full matrix, no path filters and no pass-marker skips,
  # so new CVEs (image scan), runner-image drift, and anything a path filter
  # misses surface within a day. Includes the jobs that only run off-PR
  # (cross-OS install, release-artifact smoke, image scan).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Release gate: release.yml calls this workflow with `full: true` on every
  # vX.Y.Z tag, so the off-PR jobs (cross-OS install, goreleaser snapshot,
  # image scan) have run on the exact tagged commit before anything publishes.
  workflow_call:
    inputs:
      full:
        description: Run every job with no path filters and no pass-marker skips.
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only auto-cancel superseded runs on PRs. On main/tags every run should finish
  # (a cancelled push-to-main or tag run could skip the release gate).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Appended to every `make test-*` pytest run (Makefile PYTEST_ARGS): lists the
  # slowest tests in each job log so regressions in suite time are visible.
  PYTEST_ARGS: --durations=25

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read # list Actions caches for the pass-marker lookup
    outputs:
      # Run tiers:
      # - `pr-tier`: pull_request / merge_group. Path-filtered; the expensive
      #   release-shape jobs (cross-OS install, goreleaser snapshot, image
      #   scan, scorecard) don't run.
      # - push to main: every core job is eligible (no path filter), and the
      #   pass markers below skip each one whose inputs already passed. Pass
      #   markers compare against what actually passed, so a cancelled earlier
      #   main run can't hide a change. The off-PR jobs use the path filter
      #   (diffed against the previous main commit) with nightly as backstop.
      # - `full`: nightly schedule / manual dispatch / release call. Every job,
      #   no filters, no pass-marker skips.
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full == true }}
      pr-tier: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && inputs.full != true }}
      # Pass markers (tools/ci_pass_markers.py): `skips` maps a job id to true
      # when that job already passed on exactly these inputs; `keys` is the
      # cache key each job saves on success. Defaults keep fromJSON valid if
      # the lookup step never ran.
      skips: ${{ steps.markers.outputs.skips || '{}' }}
      keys: ${{ steps.markers.outputs.keys || '{}' }}
      unit-tests: ${{ steps.filter.outputs.unit-tests }}
      integration-tests: ${{ steps.filter.outputs.integration-tests }}
      ui: ${{ steps.filter.outputs.ui }}
      packaging: ${{ steps.filter.outputs.packaging }}
      cli: ${{ steps.filter.outputs.cli }}
      openapi-client: ${{ steps.filter.outputs.openapi-client }}
      openapi-spec: ${{ steps.filter.outputs.openapi-spec }}
      installer: ${{ steps.filter.outputs.installer }}
      e2e-install: ${{ steps.filter.outputs.e2e-install }}
      cli-os-sensitive: ${{ steps.filter.outputs.cli-os-sensitive }}
      security-image: ${{ steps.filter.outputs.security-image }}
    steps:
      - uses: actions/checkout@v7

      # On a push to main the action diffs against the commit main was at
      # before the push; on a PR / merge group, against its base. Not run on a
      # `full` run: those ignore the filters, and a schedule / dispatch / tag
      # event has no base to diff against.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && inputs.full != true
        with:
          filters: |
            unit-tests:
              - 'src/**'
              - 'tests/unit/**'
              - 'tests/arch/**'
              # Shared test infrastructure every suite loads: the root
              # conftest registers the suite-wide plugins in tests/harness/
              # (e.g. logging isolation), and any conftest or harness edit
              # changes the fixtures the unit tests run under.
              - 'tests/__init__.py'
              - 'tests/conftest.py'
              - 'tests/**/conftest.py'
              - 'tests/harness/**'
              # tests/unit/shared/test_rule_matcher_parity.py reads the shared
              # fixture and pins the UI's vendored copy byte-for-byte to it.
              - 'tests/fixtures/**'
              - 'ui/src/shared/credentials/lib/__tests__/rule-matcher-parity.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              # The skill-drift arch test pins the human-authored sources
              # (skills/<name>/SKILL.md) byte-for-byte to their generated
              # mirrors under cli/ and src/. src/** (above) covers the web
              # mirror; add the source tree and the CLI-mirror glob so a
              # source-only edit (or a hand-edited CLI mirror) still runs it.
              - 'skills/**'
              - 'cli/internal/skillgen/content/*.md'
              # The arch suite drift-checks generated reference artifacts
              # (docs-SPA broker JSON, control spec, endpoint reference)
              # against their sources AND generators, so edits to any of them
              # must run it.
              - 'openapi/broker/**'
              - 'openapi/control/**'
              - 'ui/public/broker-openapi.json'
              - 'tools/**'
              - 'docs/reference/**'
              # tests/arch/test_config_schema_conformance.py drift-gates the
              # exported backend config schema against the Pydantic models, so
              # a hand-edit to the artifact must run the suite (GEN-10).
              - 'config/config-schema.json'
              # tests/arch/test_gateway_routes.py checks the split-deploy
              # gateway maps (Docker + Helm) against the route tables of the
              # backends each image runs (JENTIC__APPS in its Dockerfile), so a
              # deploy-only edit to any of them must run the suite.
              - 'deploy/docker/nginx/**'
              - 'deploy/docker/*.Dockerfile'
              - 'deploy/helm/jentic-one/charts/gateway/templates/**'
              # The auth-theme drift guards (tests/unit/auth/web/
              # test_theme_tokens.py) pin the packaged auth.css palette and the
              # inline logo SVG to these SPA sources. A ui-only edit to either
              # must run the unit suite, or the drift lands silently on the PR
              # and only fails the post-merge main run.
              - 'ui/src/index.css'
              - 'ui/src/shared/ui/Logo.tsx'
            integration-tests:
              - 'src/**'
              - 'tests/integration/**'
              - 'tests/web/**'
              # Shared test infrastructure both suites above load: the root
              # conftest registers the suite-wide plugins in tests/harness/
              # (logging isolation wraps every integration test), and
              # tests/harness/ also holds the shared Postgres-fixture settings.
              - 'tests/__init__.py'
              - 'tests/conftest.py'
              - 'tests/**/conftest.py'
              - 'tests/harness/**'
              # The fixture bootstrap `make start-fixtures` runs.
              - 'scripts/setup.sh'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'alembic.ini'
              - 'docker/**'
              - 'src/jentic_one/migrations/**'
              # Fixture upstream for the Flow-3 catalog-update real-backend e2e
              # (launched by ui-e2e-realbackend); a fixture-only edit must re-run.
              - 'scripts/flow3_upstream_fixture.py'
            cli:
              - 'cli/**'
              # The cli job drift-checks the generated CLI reference the docs
              # SPA renders, so hand-edits to the artifact must run it too.
              - 'ui/public/cli-reference.json'
              # check-cli-gen / check-ctl-gen regenerate the Go client and
              # installer config bindings FROM these backend-owned sources — a
              # PR that changes only a spec/schema (without touching cli/)
              # would otherwise merge with a stale generated client and break
              # the post-merge main run (the exact #1013 incident).
              - 'openapi/control/**'
              - 'openapi/broker/**'
              - 'config/config-schema.json'
              # TestMCPToolSurfaceSpec pins the MCP tool-surface contract
              # (incl. lane_overrides) from toolSpecs() into this document. A
              # hand-edit to the pin that keeps the Python side consistent
              # (byte-identical packaged copy + honest prose) would otherwise
              # merge green and only fail the Go pin test post-merge on main
              # (the same class of hole as the openapi/** entries above).
              - 'docs/reference/mcp-tools.json'
            installer:
              - 'tools/install.sh'
              - 'tests/tools/**'
            e2e-install:
              # The cross-OS install + smoke
              # matrix. The Linux leg does a real Docker install; macOS/Windows
              # build + offline-smoke the binaries. Any input that changes the
              # binaries, the installer, or the smoke contract must re-run it.
              - 'cli/**'
              - 'tools/install.sh'
              - 'deploy/docker/**'
              - 'docker/**'
              - 'src/jentic_one/migrations/**'
              - 'pyproject.toml'
              - 'uv.lock'
            cli-os-sensitive:
              # Go packages whose behaviour forks by GOOS (runtime.GOOS
              # branches or OS build tags) plus the offline-smoke scripts and
              # the build entry points. A PR touching these runs the macOS and
              # Windows e2e-install legs; any other PR leaves them to main
              # and nightly.
              - 'cli/internal/proc/**'
              - 'cli/internal/cli/ctlcmd/**'
              - 'cli/internal/cli/localagentcmd/**'
              - 'cli/internal/cli/api/**'
              - 'cli/internal/config/**'
              - 'cli/internal/install/**'
              - 'cli/internal/localagent/**'
              - 'cli/internal/mcpcfg/**'
              - 'cli/tests/e2e/**'
              - 'cli/Makefile'
              - 'cli/go.mod'
              - 'cli/go.sum'
            openapi-client:
              # Inputs that can change the generated UI client. The committed
              # spec (ui/openapi.json) is the codegen input — a spec change from
              # any backend edit lands here. package(-lock) pins the generator
              # version. The generated dir itself is included so hand-edits to
              # vendored output are caught.
              - 'ui/openapi.json'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/src/shared/api/generated/**'
            openapi-spec:
              # Inputs to the OpenAPI Scorecard job. Each run spends scorecard
              # API quota, so it only fires when a scored spec changes.
              - 'openapi/control/**'
              - 'openapi/broker/**'
            ui:
              - 'ui/**'
            packaging:
              - 'ui/**'
              - 'pyproject.toml'
              - 'src/jentic_one/shared/web/static.py'
              - 'src/jentic_one/admin/web/app.py'
              - 'src/jentic_one/shared/web/app_factory.py'
              - 'scripts/spa_packaging_smoke.*'
            security-image:
              # Inputs that change what the Trivy image scan sees: the base
              # images and OS packages (Dockerfiles), the Python dependency set
              # baked into the wheel venv, and the scan policy. A src-only edit
              # cannot add a CVE to the image, so it doesn't rebuild it. The
              # nightly schedule runs this unfiltered to pick up newly published
              # CVEs against an unchanged image.
              - 'deploy/docker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ui/package-lock.json'
              - '.trivyignore'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Needs only PyYAML, so it runs outside the project env (no uv sync).
      - name: Look up pass markers
        id: markers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # A full run never skips (the tool also refuses on schedule/dispatch).
          CI_FULL_RUN: ${{ inputs.full == true }}
        run: uv run --no-project --python 3.12 --with 'pyyaml>=6' python tools/ci_pass_markers.py lookup

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make sync

      - name: Lint
        run: make lint

      # Fails on any potential secret not allowlisted in .secrets.baseline
      # (or inline `pragma: allowlist secret`), on stale baseline entries, on
      # detector settings that differ from detect-secrets' defaults, and on a
      # baseline not in slim form. Fix with `make secrets-baseline`.
      - name: Detect secrets
        run: make detect-secrets
  # OpenAPI Scorecard for the control and broker specs, via the official
  # jentic/jentic-api-scorecard action (SARIF to the Security tab, HTML report
  # artifact, Markdown run summary).
  #
  # Opt-in on the JENTIC_SCORE_API_KEY secret: when it is unset (including fork
  # and Dependabot PRs, which get no secrets) every step skips and the job passes.
  # The score gate is the SCORECARD_MIN_SCORE repository variable: unset means
  # report-only, set it (e.g. 80) to fail a spec scoring below it. Locally the
  # same pair of env vars drives `make score`.
  #
  # The action is pinned to a full release (CLI version == engine image tag) so
  # a new scoring engine never moves the score under an unchanged spec.
  #
  # Off the PR tier: runs on a push to main that changed a scored spec, or on a
  # manual dispatch. Not nightly — an unchanged spec scores the same, and each
  # run spends quota. Locally, `make score` gives the same result pre-merge.
  score:
    name: OpenAPI Scorecard (${{ matrix.spec }})
    needs: [changes]
    if: >-
      needs.changes.outputs.pr-tier != 'true'
      && github.event_name != 'schedule'
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.openapi-spec == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        spec: [control, broker]
    env:
      JENTIC_SCORE_API_KEY: ${{ secrets.JENTIC_SCORE_API_KEY }}
    steps:
      - name: Skip when JENTIC_SCORE_API_KEY is unset
        if: env.JENTIC_SCORE_API_KEY == ''
        run: echo "::notice::JENTIC_SCORE_API_KEY is not set; skipping the ${{ matrix.spec }} scorecard."

      - uses: actions/checkout@v7
        if: env.JENTIC_SCORE_API_KEY != ''

      - name: Score ${{ matrix.spec }} spec
        if: env.JENTIC_SCORE_API_KEY != ''
        uses: jentic/jentic-api-scorecard@v1.12.0
        with:
          input: openapi/${{ matrix.spec }}/${{ matrix.spec }}.openapi.yaml
          api-key: ${{ env.JENTIC_SCORE_API_KEY }}
          min-score: ${{ vars.SCORECARD_MIN_SCORE }}
          artifact-name: scorecard-${{ matrix.spec }}

  openapi-client-drift:
    name: Generated UI client up to date
    needs: [changes]
    # Why this exists: the committed UI TS client (ui/src/shared/api/generated)
    # is a BYPRODUCT of `npm run codegen` reading ui/openapi.json. The arch test
    # `test_openapi_conformance.py` already guarantees ui/openapi.json equals the
    # live FastAPI app — but NOTHING guarded the generated client, so a contract
    # change could land with a stale client (exactly how #460's actor_id fields
    # reached main without a client regen, surfacing as noise later). This job
    # regenerates the client from the committed spec and fails on any diff, so
    # `client == codegen(committed spec)`; composed with the arch test, that
    # transitively pins `client == live app`. Node-only: no spec regen here (the
    # arch test owns that), so it stays fast and needs no Python/DB.
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.openapi-client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Regenerate the client from the committed spec
        run: npm run codegen

      - name: Fail if the generated client drifted from a clean codegen
        run: |
          if ! git diff --quiet -- src/shared/api/generated; then
            echo "::error::The generated UI client is out of date with ui/openapi.json."
            echo "::error::Run 'cd ui && npm run codegen' and commit the result."
            echo "::error::(If the spec itself is stale, run 'make openapi' first.)"
            echo "----- drift (file stat) -----"
            git diff --stat -- src/shared/api/generated
            echo "----- drift (full diff) -----"
            git --no-pager diff -- src/shared/api/generated
            exit 1
          fi
          echo "Generated UI client is in sync with ui/openapi.json."

  # Source-tree security gates: fast (~30s), on every run. The BUILT-image scan
  # lives in `security-image` below, path-gated on the image's inputs, so the
  # image build no longer sits on every PR's critical path.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Bandit security linter
        run: |
          uv run --with bandit bandit \
            -r src/ \
            -c pyproject.toml \
            --severity-level high \
            --confidence-level high

      - name: Check dependency licenses
        run: |
          uv sync --frozen
          uv run --with pip-licenses pip-licenses \
            --fail-on="GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later"

  # Scans the BUILT app image (base-image OS packages included) — the same class
  # of finding AWS ECR / registry scanners reject on, so we fail here before a
  # registry does. Builds deploy/docker/app.multiarch.Dockerfile for linux/amd64,
  # the self-contained file release.yml builds and ships, with the BuildKit
  # layer cache in the GitHub Actions cache so an unchanged base/deps layer set
  # is a cache hit. `ignore-unfixed` keeps the gate actionable: Debian-slim
  # always carries unfixed low-priority CVEs, and a permanently red gate gets
  # ignored. Overrides go in .trivyignore (CVE id + justification + expiry).
  security-image:
    name: Security scan (app image)
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.security-image == 'true'
    runs-on: ubuntu-latest
    steps:
      # The image build (torch wheels + two base stages) needs more disk than a
      # stock runner has free on a cold cache; only pay for the cleanup then.
      - name: Free disk space (only when short)
        run: |
          avail_gb=$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')
          echo "free on /: ${avail_gb}G"
          if [ "${avail_gb}" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi

      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the app image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/app.multiarch.Dockerfile
          platforms: linux/amd64
          tags: jentic-one/app:scan
          load: true
          cache-from: type=gha,scope=app-image
          # Only main writes the layer cache (PRs read it): per-PR writes would
          # compete with every other cache for the repo's 10 GB budget.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=app-image,mode=max' || '' }}

      - name: Trivy image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: jentic-one/app:scan
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  # No `needs: security`: nothing here consumes the security job's output, and
  # waiting on it put the image build on every backend PR's critical path.
  # `ci-status` still requires both.
  #
  # Pass markers: a job whose exact inputs already passed (on this ref or on
  # main) is skipped via `skips`, and saves its own marker as its last step
  # (tools/ci_pass_markers.py; .github/actions/ci-pass-marker).
  test-unit:
    name: Unit tests
    needs: [lint, changes]
    if: >-
      (needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.unit-tests == 'true')
      && !fromJSON(needs.changes.outputs.skips)['test-unit']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make sync

      - name: Run unit tests
        run: make test-unit

      - uses: ./.github/actions/ci-pass-marker
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)['test-unit'] }}

  test-arch:
    name: Architecture tests
    needs: [lint, changes]
    # Same input set as the unit suite (the unit-tests filter already lists
    # tests/arch/** and every drift-gated artifact the arch suite reads).
    if: >-
      (needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.unit-tests == 'true')
      && !fromJSON(needs.changes.outputs.skips)['test-arch']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make sync

      - name: Run architecture tests
        # CI runs arch tests against the committed VENDORED rules facts
        # (tests/arch/vendored/*). It never mounts an external rules source —
        # the vendored-facts OSS-safety guard runs here regardless.
        run: make test-arch

      - uses: ./.github/actions/ci-pass-marker
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)['test-arch'] }}

  test-integration:
    name: Integration tests (${{ matrix.backend }})
    needs: [lint, changes]
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.integration-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, sqlite]
    # A job-level `if` cannot see `matrix`, so each leg checks its own pass
    # marker here and every step below is gated on it.
    env:
      PASSED: ${{ fromJSON(needs.changes.outputs.skips)[format('test-integration-{0}', matrix.backend)] }}
    # Postgres as a service container: the runner pulls and boots it while the
    # job is being set up, instead of serially in a step. An empty image skips
    # the service on the sqlite leg. Same image/credentials as
    # docker/local-setup/docker-compose.yaml; `make start-fixtures` with
    # JENTIC_PG_EXTERNAL=1 then applies that compose file's init SQL + migrations.
    services:
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: jentic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jentic"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Already passed on these inputs
        if: env.PASSED == 'true'
        run: echo "::notice::Integration (${{ matrix.backend }}) already passed on identical inputs; skipping."

      - uses: actions/checkout@v7
        if: env.PASSED != 'true'

      - name: Install uv
        if: env.PASSED != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: env.PASSED != 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: env.PASSED != 'true'
        run: make sync

      - name: Bootstrap the database (roles, schemas, migrations)
        if: env.PASSED != 'true' && matrix.backend == 'postgres'
        env:
          JENTIC_PG_EXTERNAL: "1"
        run: make start-fixtures

      - name: Run integration tests (postgres)
        if: env.PASSED != 'true' && matrix.backend == 'postgres'
        run: make test-integration

      - name: Run integration tests (sqlite)
        if: env.PASSED != 'true' && matrix.backend == 'sqlite'
        run: make test-integration-sqlite

      - uses: ./.github/actions/ci-pass-marker
        if: env.PASSED != 'true'
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)[format('test-integration-{0}', matrix.backend)] }}

  # Container images are built + published on release, not on branch CI. The
  # `publish-image` job in .github/workflows/release.yml builds the `app` image
  # and pushes it to GHCR on a vX.Y.Z tag. To build locally: `make build-app`
  # (or `make release-image REGISTRY=…` to push). See deploy/README.md.

  ui:
    name: UI build & lint
    needs: [changes]
    if: >-
      (needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.ui == 'true')
      && !fromJSON(needs.changes.outputs.skips)['ui']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint-rule enforcement tests (#510/#511 guardrails)
        # Node-environment Vitest project (vitest.lint.config.ts): no browser.
        run: npm run test:lint

      - name: Build
        run: npm run build

      - uses: ./.github/actions/ci-pass-marker
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)['ui'] }}

  # The browser-mode component suite, split by file across shards so no single
  # job carries the whole suite. Changing the shard count means changing the
  # matrix, the `--shard` denominator, and the ui-test-<n> ids in
  # tools/ci_pass_markers.py (tests/arch/test_ci_pass_markers.py pins them).
  ui-test:
    name: UI tests (shard ${{ matrix.shard }}/3)
    needs: [changes]
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PASSED: ${{ fromJSON(needs.changes.outputs.skips)[format('ui-test-{0}', matrix.shard)] }}
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Already passed on these inputs
        if: env.PASSED == 'true'
        working-directory: .
        run: echo "::notice::UI shard ${{ matrix.shard }} already passed on identical inputs; skipping."

      - uses: actions/checkout@v7
        if: env.PASSED != 'true'

      - name: Set up Node.js
        if: env.PASSED != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: env.PASSED != 'true'
        run: npm ci

      - name: Install Playwright browser (Chromium)
        # Vitest runs in browser mode via the Playwright provider, so component
        # tests need a real Chromium (cached; OS libs installed every run).
        if: env.PASSED != 'true'
        uses: ./.github/actions/playwright-chromium

      - name: Test
        if: env.PASSED != 'true'
        run: npm run test:run -- --shard=${{ matrix.shard }}/3

      - uses: ./.github/actions/ci-pass-marker
        if: env.PASSED != 'true'
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)[format('ui-test-{0}', matrix.shard)] }}

  ui-e2e:
    name: UI e2e (mocked)
    needs: [changes]
    if: >-
      (needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.ui == 'true')
      && !fromJSON(needs.changes.outputs.skips)['ui-e2e']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        uses: ./.github/actions/playwright-chromium

      - name: Run mocked e2e (boots dev server with MSW)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - uses: ./.github/actions/ci-pass-marker
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)['ui-e2e'] }}

  smoke-packaging:
    name: Packaging smoke (SPA served from wheel)
    needs: [changes]
    # Why now: this PR coupled FE and BE — the admin wheel now packages and
    # serves the UI bundle. The per-side filters above test each side in
    # isolation against a *fake* static dir; nothing checks the real seam
    # (force-include -> importlib.resources -> mount_spa) against a real wheel.
    # This job builds the real UI + wheel, installs it clean, and asserts the
    # SPA is served and API 404s preserved. DB-free, so it's cheap.
    # Later: when real UI flows exist (login, lists), graduate to a true e2e
    # job (Playwright + Postgres) and keep this as the fast packaging gate.
    #
    # NOTE (pipeline review F2/A1): this wheel is a PACKAGING TEST ONLY — it is
    # never published. The container image (release.yml `publish-image`) is the
    # sole supported backend distribution; there is no `pip install jentic-one`.
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build UI + wheel, install in clean venv, verify SPA serving
        run: make smoke-packaging

  ui-e2e-realbackend:
    name: UI e2e (real backend)
    needs: [changes]
    # Real Postgres + the combined app serving the SPA same-origin on :8000.
    # Complements `ui-e2e` (mocked, MSW) and `smoke-packaging` (DB-free seam):
    # this is the only job that drives the genuine auth flow (first-run gate
    # rotation -> storageState -> authenticated shell) against a live backend.
    #
    # NOTE ON SCOPE: this serves the *staged source tree* (cp ui/dist ->
    # src/jentic_one/static), NOT the installed wheel. It proves the live auth
    # flow + same-origin SPA serving, but it does NOT cover packaging
    # (force-include, lockfile pins, importlib resolution against a built
    # wheel) — that is owned by `smoke-packaging`. Do not remove that job
    # assuming this one covers the packaging seam.
    #
    # Triggers on UI, migration, or packaging-seam changes.
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.integration-tests == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    # Fresh Postgres per job (no volume), booted during job setup. See the
    # test-integration job for the JENTIC_PG_EXTERNAL bootstrap.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jentic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jentic"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: make sync

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser (Chromium)
        uses: ./.github/actions/playwright-chromium

      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Stage SPA bundle for same-origin serving
        # `make start-app` runs from source; mount_spa resolves the bundle via
        # importlib.resources.files("jentic_one")/"static" (the wheel
        # force-include target). Mirror ui/dist there so the source run serves
        # the SPA same-origin, exactly as the packaged wheel does.
        run: |
          rm -rf src/jentic_one/static && cp -r ui/dist src/jentic_one/static
          # Fail loudly here if the build produced no real bundle (e.g. only the
          # ui/dist/.gitkeep placeholder). Without index.html, mount_spa returns
          # False and the SPA specs would fail later with opaque 404/HTML errors.
          test -f src/jentic_one/static/index.html \
            || { echo "::error::SPA bundle missing: src/jentic_one/static/index.html not found after staging"; exit 1; }

      - name: Start database fixtures (clean DB -> first-run gate present)
        env:
          JENTIC_PG_EXTERNAL: "1"
        run: make start-fixtures

      - name: Start the Flow-3 fixture upstream
        # A controllable upstream on loopback for the catalog update-notify e2e
        # (flow3-catalog-update.spec.ts): serves a catalog manifest + a mutable
        # OpenAPI spec, with POST /control/bump to simulate an upstream change.
        # Backgrounded in its own session so teardown can reap it. The spec self-
        # skips if this isn't up, so a failure to launch degrades to a skip.
        run: |
          setsid python scripts/flow3_upstream_fixture.py > /tmp/flow3-upstream.log 2>&1 &
          echo "FLOW3_UPSTREAM_PGID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "flow3 upstream ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "flow3 upstream did not become ready"; cat /tmp/flow3-upstream.log; exit 1

      - name: Start the combined app
        # Force reload off: config/local.yaml sets server.reload: true, which
        # spawns a file-watching reloader parent + worker child. Backgrounding
        # that with `&` only tracks the parent and the watcher can restart the
        # worker mid-suite when files under src/ change. Reload has no value in
        # CI and harms determinism, so we override it and capture a single PID.
        env:
          JENTIC__SERVER__RELOAD: "false"
          # Flow-3 catalog update-notify e2e wiring (flow3-catalog-update.spec.ts):
          # point the catalog manifest at the loopback fixture, admit that loopback
          # upstream through the SSRF egress guard, and shorten the sweep interval
          # so a re-probe happens on demand (the spec still drives it via
          # POST /catalog:refresh).
          #
          # SCOPE: this redirects the catalog manifest for the ENTIRE realbackend
          # suite, not just flow3 — every spec in this job sees the one-entry fixture
          # manifest, not the real public catalog. Harmless today (no other spec
          # asserts real-catalog Discover content), but if you add a spec that does,
          # it will silently run against this fixture. Move this env onto a dedicated
          # job (or gate the fixture per-spec) before relying on real catalog content.
          JENTIC__CATALOG__MANIFEST_URL: "http://127.0.0.1:8099/apis.json"
          JENTIC__CATALOG__MANIFEST_MAX_AGE_SECONDS: "5"
          JENTIC__CATALOG__UPDATE_CHECK_INTERVAL_SECONDS: "5"
          JENTIC__INGEST__EGRESS__ALLOWED_PRIVATE_SUBNETS: "127.0.0.0/8"
        run: |
          # Own a process group so teardown can reap uvicorn even though it runs
          # under `make -> uv -> python` (kill of the make PID alone wouldn't
          # propagate to the python grandchild).
          setsid make start-app > /tmp/jentic-app.log 2>&1 &
          echo "APP_PGID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/admin/health >/dev/null 2>&1; then
              echo "app ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not become ready"; cat /tmp/jentic-app.log; exit 1

      - name: Start the standalone broker
        # The broker is its own surface (not part of the combined app). The
        # #1543 follow-ups e2e drives a real credential access through it to a
        # loopback upstream the spec serves itself, so loopback egress is
        # admitted. Same reload/process-group handling as the app above.
        env:
          JENTIC__SERVER__RELOAD: "false"
          JENTIC__BROKER__EGRESS__ALLOWED_PRIVATE_SUBNETS: "127.0.0.0/8"
        run: |
          setsid make start-broker > /tmp/jentic-broker.log 2>&1 &
          echo "BROKER_PGID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8100/health >/dev/null 2>&1; then
              echo "broker ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "broker did not become ready"; cat /tmp/jentic-broker.log; exit 1

      - name: Run real-backend e2e
        working-directory: ui
        run: npm run e2e:docker
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-realbackend
          path: ui/playwright-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat /tmp/jentic-app.log || true

      - name: Dump broker log on failure
        if: failure()
        run: cat /tmp/jentic-broker.log || true

      - name: Dump Flow-3 upstream log on failure
        if: failure()
        run: cat /tmp/flow3-upstream.log || true

      - name: Stop the app
        if: always()
        run: |
          # `setsid make ...` made the app its own session/group leader, and `$!`
          # is that leader's PID == the PGID. Kill the whole group to reap
          # make/uv/python together. Negative PID targets the process group.
          if [ -n "${APP_PGID:-}" ]; then
            kill -TERM "-${APP_PGID}" 2>/dev/null || true
          fi

      - name: Stop the broker
        if: always()
        run: |
          if [ -n "${BROKER_PGID:-}" ]; then
            kill -TERM "-${BROKER_PGID}" 2>/dev/null || true
          fi

      - name: Stop the Flow-3 fixture upstream
        if: always()
        run: |
          if [ -n "${FLOW3_UPSTREAM_PGID:-}" ]; then
            kill -TERM "-${FLOW3_UPSTREAM_PGID}" 2>/dev/null || true
          fi

  cli:
    name: Go CLI lint & test
    needs: [changes]
    if: >-
      (needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.cli == 'true')
      && !fromJSON(needs.changes.outputs.skips)['cli']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          # setup-go's built-in cache is keyed only on go.sum and is immutable
          # per key, so on a busy branch it restores a GOCACHE that predates the
          # branch's own code and every run recompiles near-cold (~60s builds
          # that take ~3s warm). The explicit sha-keyed cache below saves an
          # updated build cache on every run instead.
          cache: false

      # Restore-only on PRs: each sha-keyed save is ~0.5 GB, and per-PR saves
      # pushed the repo past the 10 GB Actions cache limit, so LRU eviction
      # kept discarding every other cache (uv, npm, pass markers). PRs restore
      # main's latest entry via restore-keys; main saves (step at the end).
      - name: Go module + build cache (restore)
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cli-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-cli-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-
            go-cli-${{ runner.os }}-

      - name: Build
        run: go build ./...

      # The CLI must build for every OS we ship binaries for. Windows regressed
      # once on a Unix-only syscall (config.lockConfig), so gate it on the PR.
      # `go build ./...` covers ALL packages, including ones not yet reachable
      # from a shipped binary. Reuses this job's warm build cache (~30s).
      - name: Cross-compile (windows/amd64, darwin/arm64)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...

      # Pipeline review F3/C1: lint the GoReleaser config on the PR, not at tag
      # time. A malformed archive/ldflag/cask stanza otherwise stays invisible
      # until a real release. Pure config check, no build. The full snapshot
      # build is the off-PR `cli-artifact-smoke` job.
      - name: GoReleaser config valid
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
          workdir: cli

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: cli

      - name: Test (race)
        run: go test -race ./...

      # The typed OpenAPI clients and
      # their spec companions under client/generated/ are generated from the two
      # committed specs (openapi/{control,broker}). This regenerates them and
      # fails on any diff, so `client/generated == codegen(committed specs)` — a
      # spec change that lands without a regen is caught here rather than as a
      # runtime surprise. Mirrors the openapi-client-drift job's posture for the
      # UI client.
      - name: Generated CLI client up to date
        run: make check-cli-gen

      # jenticctl's installer flags,
      # wizard, and doctor are generated from the backend config schema
      # (config/config-schema.json, itself drift-gated in the backend job).
      # This re-vendors the schema and regenerates the Go struct, failing on any
      # diff — the cli-side half of the AppConfig → schema → BackendConfig chain,
      # mirroring check-cli-gen's posture for the OpenAPI clients.
      - name: Generated installer config up to date
        run: make check-ctl-gen

      # CLI guardrails: architectural
      # boundary tests and the V1 characterization (golden) contract. Both are
      # already covered by `go test -race ./...` above, but naming them as an
      # explicit step surfaces guardrail failures distinctly in the CI log
      # (mirrors the backend job's `make test-arch`).
      - name: Architecture & golden guardrails
        run: |
          make test-arch
          make test-golden

      # External-consumer contract: a
      # throwaway out-of-tree module `go get`s the SDK, imports client/..., and
      # must build with a dependency graph free of cobra/charmbracelet/internal.
      # This is the concrete "usable from outside easily" guarantee — stronger
      # than the arch import-scan because it exercises the real build graph an
      # external user resolves, so an internal/ or UI-dep leak into client/ fails
      # here at dependency-resolution time.
      - name: Public SDK external-consumer contract
        run: make test-sdk-consumer

      # ui/public/cli-reference.json (rendered by the docs SPA as "Reference →
      # CLI") is generated from the cobra command tree by `make cli-reference`.
      # Nothing else pins it, so a command/flag change without a regen would
      # silently drift the published CLI docs.
      - name: CLI reference up to date
        run: |
          go run ./cmd/clidocs -o ../ui/public/cli-reference.json
          # `status --porcelain` (not `diff --exit-code`) so a deleted-then-
          # regenerated artifact shows up as untracked instead of passing.
          if [ -n "$(git status --porcelain -- ../ui/public/cli-reference.json)" ]; then
            git --no-pager diff -- ../ui/public/cli-reference.json
            echo '::error::ui/public/cli-reference.json is out of date. Run `make cli-reference` and commit.'
            exit 1
          fi

      - name: Go module + build cache (save, main only)
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cli-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-${{ github.sha }}

      - uses: ./.github/actions/ci-pass-marker
        with:
          key: ${{ fromJSON(needs.changes.outputs.keys)['cli'] }}

  # Release-artifact guard: `goreleaser release --snapshot` has no target
  # filter (Pro feature), so it compiles the full 10-target release matrix
  # (jenticctl×4 + jentic×6) with -trimpath — by far the most expensive CLI
  # step. Off the PR tier: it runs on a push to main that changed cli/**, and
  # nightly; release.yml runs the real goreleaser build on every tag. The cheap
  # guards a PR does need (cross-compile, `goreleaser check`) live in the `cli`
  # job.
  cli-artifact-smoke:
    name: Go CLI release artifact smoke
    needs: [changes]
    if: >-
      needs.changes.outputs.pr-tier != 'true'
      && (needs.changes.outputs.full == 'true' || needs.changes.outputs.cli == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          # See the `cli` job: sha-keyed cache below instead of the immutable
          # go.sum-keyed one, so warm runs reuse the -trimpath build cache.
          cache: false

      - name: Go module + build cache (restore; saved from main only, see `cli`)
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Distinct prefix from the `cli` job: these builds use -trimpath +
          # release ldflags, so the cache contents don't overlap — separate
          # entries keep both caches small and avoid save-key collisions.
          key: go-cli-smoke-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-cli-smoke-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-
            go-cli-smoke-${{ runner.os }}-

      # WIN-4 (cli-review2 windows-build): guard the *published artifact shape*,
      # not just `go build` — and doubles as pipeline review F3/C2 (a full
      # GoReleaser snapshot build dry-run). A broken archive stanza (e.g. dropping `windows`
      # from goos, or mis-formatting the zip override) compiles fine but only
      # surfaces at tag time. Run a snapshot goreleaser build (no sign/sbom/
      # publish) and assert the windows `.zip` exists and contains `jentic.exe`
      # (and only jentic — jenticctl is not shipped for Windows, WIN-6).
      - name: GoReleaser artifact smoke (windows .zip shape)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert windows zip contains jentic.exe only
        run: |
          set -euo pipefail
          # This job sets defaults.run.working-directory: cli, and the
          # goreleaser step above runs with workdir: cli too, so goreleaser
          # writes to cli/dist — which from THIS step's cwd (also cli) is just
          # ./dist. (The old `cli/dist` here resolved to cli/cli/dist and always
          # missed.) Fall back to cli/dist in case a future default change moves
          # this step's cwd back to the repo root.
          dist=""
          for d in dist cli/dist; do
            [ -d "$d" ] && { dist="$d"; break; }
          done
          test -n "${dist}" || { echo "::error::goreleaser produced no dist dir"; pwd; ls -la . || true; exit 1; }
          echo "artifact dir: ${dist}"
          zip="$(ls "${dist}"/jentic_*_windows_amd64.zip 2>/dev/null | head -n1 || true)"
          test -n "${zip}" || { echo "::error::no windows amd64 zip emitted by goreleaser"; ls -la "${dist}" || true; exit 1; }
          echo "found windows archive: ${zip}"
          contents="$(unzip -Z1 "${zip}")"
          echo "${contents}"
          echo "${contents}" | grep -qx 'jentic.exe' || { echo "::error::windows zip is missing jentic.exe"; exit 1; }
          if echo "${contents}" | grep -qi 'jenticctl'; then
            echo "::error::windows zip must NOT ship jenticctl (WIN-6)"; exit 1
          fi
          # linux/darwin tarballs must still be produced (byte-shape invariant).
          ls "${dist}"/jentic_*_linux_amd64.tar.gz "${dist}"/jenticctl_*_linux_amd64.tar.gz >/dev/null
      # The Windows package channels are generated from the zips above (the
      # publish is skipped in snapshot mode, manifest GENERATION is not). A
      # broken winget/scoops stanza — or one that drifts from the commands the
      # docs advertise (`winget install Jentic.Jentic`, `scoop install jentic`)
      # — otherwise only surfaces at tag time. The docs↔config identifier
      # match itself is pinned by tests/arch/test_install_docs_conformance.py;
      # this asserts the config actually yields manifests.
      - name: Assert winget + scoop manifests generated
        run: |
          set -euo pipefail
          dist=""
          for d in dist cli/dist; do
            [ -d "$d" ] && { dist="$d"; break; }
          done
          test -n "${dist}" || { echo "::error::goreleaser produced no dist dir"; exit 1; }
          installer="$(find "${dist}/winget" -name '*.installer.yaml' 2>/dev/null | head -n1 || true)"
          test -n "${installer}" || { echo "::error::no winget installer manifest generated under ${dist}/winget"; exit 1; }
          echo "winget installer manifest: ${installer}"
          grep -q '^PackageIdentifier: Jentic.Jentic$' "${installer}" \
            || { echo "::error::winget manifest lost the Jentic.Jentic identifier the docs advertise"; exit 1; }
          grep -q 'RelativeFilePath: jentic.exe' "${installer}" \
            || { echo "::error::winget manifest does not install jentic.exe"; exit 1; }
          test -f "${dist}/scoop/jentic.json" \
            || { echo "::error::no scoop manifest generated at ${dist}/scoop/jentic.json"; exit 1; }
          grep -q '"jentic.exe"' "${dist}/scoop/jentic.json" \
            || { echo "::error::scoop manifest does not install jentic.exe"; exit 1; }

      - name: Go module + build cache (save, main only)
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cli-smoke-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}-${{ github.sha }}

  installer:
    name: Installer script tests
    needs: [changes]
    if: needs.changes.outputs.pr-tier != 'true' || needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The harness itself is a bash script; it internally drives the installer
      # through sh/dash/bash (via run_installer_via) to exercise the POSIX
      # re-exec path that the macOS `curl ... | sh` failure was about. Ubuntu's
      # /bin/sh is dash, so the sh-invocation cases run for real here.
      - name: Run installer tests
        run: bash tests/tools/install_test.sh

  # Cross-platform install + smoke matrix.
  #   - ubuntu-24.04:  full headless Docker install + live-stack smoke (deep).
  #   - macos-latest:  build via install.sh (no chain-install) + offline smoke.
  #   - windows-latest: build the binaries + offline smoke (install.sh is
  #                     WSL-only, so native Windows is build + agent-surface).
  # The offline smoke asserts the binary/agent contract that holds with no
  # server; the Linux leg additionally proves the real install path.
  e2e-install:
    name: E2E install & smoke (${{ matrix.os }})
    needs: [changes]
    # Linux leg: on any PR/push that changes the install inputs. macOS/Windows
    # legs: on the PR tier only when OS-sensitive CLI code changed
    # (`cli-os-sensitive`); otherwise on push to main (install inputs changed)
    # and nightly. Expressions can't read `matrix` in a job-level `if`, so the
    # matrix itself is narrowed instead.
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.e2e-install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.pr-tier == 'true' && needs.changes.outputs.cli-os-sensitive != 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # ---- Build the binaries (all OSes) ----
      - name: Build binaries
        working-directory: cli
        run: make build

      # ---- Win/mac: run the OS-sensitive Go tests (OPS-21) ----
      # The full race/unit/golden/arch suite runs only on Ubuntu (the `cli`
      # job). The packages whose behavior forks by GOOS — process liveness/
      # terminate (`internal/proc`), `jenticctl stop`, and the local-agent
      # launcher/degrade path — must also execute on Windows and macOS so a
      # GOOS-specific regression (e.g. OPS-20's Windows signal semantics) fails
      # CI here instead of silently on a user's machine. Ubuntu already covers
      # these in the `cli` job, so this leg is Win/mac only.
      - name: OS-sensitive Go tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: cli
        run: go test ./internal/proc/... ./internal/cli/ctlcmd/... ./internal/cli/localagentcmd/...

      # ---- Windows: build + offline smoke (install.sh is WSL-only) ----
      # `shell: pwsh` already runs this block in PowerShell; invoke the script
      # with the call operator and re-propagate its exit code. (A nested
      # `pwsh -File ...` swallows the inner script's failure — an unhandled
      # error there left $LASTEXITCODE unset and the job passed spuriously.)
      - name: Offline smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ github.workspace }}/cli/tests/e2e/smoke.ps1" "${{ github.workspace }}/cli"
          exit $LASTEXITCODE

      # ---- macOS: exercise install.sh's build/PATH path, then offline smoke ----
      - name: Build via install.sh (macOS, no chain-install)
        if: runner.os == 'macOS'
        env:
          JENTIC_NO_INSTALL: "1" # build + PATH only; do not chain into `jenticctl install`
        run: bash tools/install.sh || true # tolerate PATH-rc edits failing on the runner; the smoke uses the built binaries directly

      - name: Offline smoke (macOS)
        if: runner.os == 'macOS'
        run: bash cli/tests/e2e/smoke.sh "${{ github.workspace }}/cli"

      # ---- Linux: full headless Docker install, then live-stack smoke ----
      # This leg is hard-gating: it exercises the real `jenticctl install` deep
      # Docker path end to end. It relies on the install hardening (#998):
      # schema bootstrap runs
      # idempotently inside the Alembic migration runner (no fragile run-once
      # docker-entrypoint-initdb.d script, so a half-init volume can heal), the
      # managed Postgres is NOT published to the host by default, and every
      # published port is bound to the draft host (loopback by default) — so the
      # assertions below hold on a stock runner.
      - name: Headless Docker install (Linux)
        id: linux_install
        if: runner.os == 'Linux'
        run: ./cli/jenticctl install --defaults --no-wizard

      - name: DB logs on install failure (Linux)
        if: runner.os == 'Linux' && failure() && steps.linux_install.outcome == 'failure'
        run: |
          echo "::group::db container logs"
          docker compose -p jentic -f "$HOME/.jentic/docker-compose.yaml" logs db || true
          echo "::endgroup::"

      - name: Stack is healthy (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "app healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy"
          docker compose -p jentic -f "$HOME/.jentic/docker-compose.yaml" logs || true
          exit 1

      - name: Published ports honour the loopback bind (Linux, #992)
        if: runner.os == 'Linux'
        run: |
          # The generated compose binds published ports to the draft host
          # (127.0.0.1 by default), so nothing must be listening on 0.0.0.0/*.
          for port in 8000 8100; do
            if ss -tln "sport = :$port" | grep -E "0\.0\.0\.0:$port|\*:$port"; then
              echo "::error::port $port is listening on all interfaces despite the loopback default"
              ss -tlnp; exit 1
            fi
          done

      - name: Doctor is clean (Linux)
        if: runner.os == 'Linux'
        run: ./cli/jenticctl doctor

      - name: Live-stack smoke (Linux)
        if: runner.os == 'Linux'
        run: bash cli/tests/e2e/smoke.sh "${{ github.workspace }}/cli" --live http://127.0.0.1:8000

      # Offline smoke ALWAYS runs on Linux and IS hard-gating — it proves the
      # binaries + agent surface work regardless of the Docker-stack install.
      - name: Offline smoke (Linux)
        if: runner.os == 'Linux'
        run: bash cli/tests/e2e/smoke.sh "${{ github.workspace }}/cli"

      - name: Teardown (Linux)
        if: always() && runner.os == 'Linux'
        run: docker compose -p jentic -f "$HOME/.jentic/docker-compose.yaml" down -v || true

  ci-status:
    name: CI status
    if: always()
    needs: [lint, openapi-client-drift, score, security, security-image, test-unit, test-arch, test-integration, ui, ui-test, ui-e2e, ui-e2e-realbackend, smoke-packaging, cli, cli-artifact-smoke, installer, e2e-install]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        # `needs.*.result` covers every job in `needs` above, so a new job only
        # has to be added to that one list.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more required jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped"
