version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The repo is a uv project (CI uses astral-sh/setup-uv + `make sync`), so the
  # updater must target the uv lockfile, not pip. The original "pip" ecosystem
  # pointed at a manifest this project does not use.
  # Dependency bumps use the `build` type (not `chore`): release-please hides
  # chore commits from the changelog, while build lands under "Build System",
  # so lib updates stay visible in release notes.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    # uv does not support the group-level `dependency-type` selector (only
    # bundler/composer/mix/maven/npm/pip do), so dev/prod can't be split that
    # way. Group all uv updates into one PR instead — it keeps the lockfile
    # internally consistent and avoids a flood of single-package PRs.
    groups:
      python:
        patterns: ["*"]

  # The Docker base images are digest-pinned (ARG defaults in
  # deploy/docker/python-base.Dockerfile) for reproducible builds; this
  # keeps those digests fresh so the published image doesn't accumulate
  # already-patched base CVEs between manual bumps. The image-scan CI job
  # (ci.yml) is the enforcement half: it fails on fixable HIGH/CRITICAL.
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      docker-bases:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    # Coupled toolchains must upgrade together or `npm ci` fails with ERESOLVE
    # (e.g. vite 8 needs @vitejs/plugin-react 6 — split across PRs neither
    # installs). Grouping lands each toolchain as a single, installable PR.
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router"
      testing:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "msw"
          - "axe-core"
      types:
        patterns:
          - "@types/*"
    # eslint 10 shipped ahead of its plugin ecosystem: eslint-plugin-jsx-a11y
    # (latest 6.10.2) and eslint-plugin-react (latest 7.37.5) still declare
    # peer eslint <=9, and typescript-eslint (latest 8.69.0) caps
    # typescript <6.1.0 — so a grouped eslint-10 + typescript-7 PR can never
    # `npm ci` (ERESOLVE; see PR #1266). Hold those majors back until the
    # plugins publish eslint-10/TS-7 support, then delete these entries and
    # let the eslint group take the coupled majors in one installable PR.
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]
