openapi: 3.1.0
info:
  title: Broker API
  version: "0.44.0" # x-release-please-version
  summary: Secure execution proxy for upstream APIs — credentials never leave the Broker.
  contact:
    name: Jentic Platform Team
    url: https://jentic.com
    email: support@jentic.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    ## Overview

    The Broker is the platform's stateless data plane. Send it any
    HTTP request with the upstream URL as the path; it injects the
    caller's stored credentials, forwards method/headers/body as-is,
    and returns the upstream response.

    ```
    POST https://broker.your-instance.example/petstore.swagger.io/v2/pet
    ```

    Secrets stay off agents and end-user devices, outbound traffic
    has one auditable choke-point, and credentials rotate centrally
    without redeploying callers. Sync responses return `200` with the
    upstream body; a call sent with `Prefer: respond-async` returns
    `202` with a polling link into the control plane.

    Auth: every operation expects `Authorization: Bearer <token>` except
    `GET /health`. Broker-added metadata is confined to the `Jentic-*`
    header namespace — anything else on a response belongs to the
    upstream.

    Credential, agent-binding, and API-revision management live on the
    [control plane](https://control.your-instance.example), not here.

    ## Path format

    The request path **is** the upstream URL. The broker reconstructs the
    full target from your path, adding `https://` when no scheme is present:

    | You send | Broker proxies to |
    |----------|-------------------|
    | `GET /api.example.com/v1/users` | `https://api.example.com/v1/users` |
    | `POST /petstore.swagger.io/v2/pet` | `https://petstore.swagger.io/v2/pet` |
    | `GET /http://127.0.0.1:8080/get` | `http://127.0.0.1:8080/get` |
    | `GET /https://api.example.com/v1/users` | `https://api.example.com/v1/users` |

    For HTTPS upstream targets (the common case), omit the scheme — just use
    `/{host}/{path}`. For plain HTTP targets (e.g. local development), include
    the full `http://` scheme in the path so the broker doesn't upgrade to HTTPS.

    Query strings pass through as-is: `/api.example.com/search?q=foo` works.

    ## Executing a request

    The HTTP method you use on `/{upstream_url}` is the method the Broker
    sends to the upstream service — every standard method (`GET`, `POST`,
    `PUT`, `PATCH`, `DELETE`, `HEAD`, `OPTIONS`) is supported. Request
    headers and body are forwarded as-is; the Broker injects the caller's
    stored credentials for the target API.

    The path, query, and header parameters documented on `/{upstream_url}`
    apply to every method. Per-method operations only differ in semantic
    intent and (for methods that conventionally carry a body) in
    `requestBody` shape.

    ## Sync vs async

    By default the Broker executes the call synchronously, waiting for the
    upstream up to the deployment's upstream timeout (`broker.upstream_timeout_s`,
    30 seconds by default) and answering `200` with the upstream response.
    Exceeding that timeout is a failure, not a hand-off: the call answers
    `504 upstream_timeout`.

    Async is opt-in. `Prefer: respond-async` queues the call and returns
    `202` immediately with a polling link into the control plane; the
    preference the Broker acted on comes back in `Preference-Applied`. A
    `202` also arrives unrequested when a `require-approval` permission rule
    holds the call for human approval — the two `202` bodies are told apart
    by `status` (`queued` vs `held`).

    ## Reading the response

    Errors the Broker raises itself (authentication and authorization
    failures, missing or ambiguous credentials, URL-resolution failures,
    size caps, policy denials, giving up on the upstream) use an RFC 9457
    Problem Details body (`application/problem+json`) — the `BrokerProblem`
    schema, which is the shared `ProblemDetails` schema from
    [jentic/api-problem-details](https://github.com/jentic/api-problem-details)
    plus the Broker's `error_origin` and `agent_directive` members.
    Field-level validation failures populate the `errors[]` extension.

    An error the *upstream* returns is **not** rewritten: its status, body
    and `Content-Type` are forwarded verbatim, exactly as a `200` would be.
    Attribution therefore lives in the response headers, not in the body:

    | On a non-2xx response | Who failed | Body shape |
    |---|---|---|
    | `Jentic-Error-Origin: broker` | The Broker — it rejected the request shape, could not resolve or authorize the call, or gave up on the upstream (timeout, dropped or refused connection, deadline, failed token refresh, oversized response). The upstream either was never called or never answered. | `application/problem+json` (`BrokerProblem`), with `error_origin: broker` repeated in the body |
    | `Jentic-Error-Origin: upstream` with `Jentic-Upstream-Status: {status}` | The upstream API answered with this status and the Broker mirrored it. | The upstream's own body and `Content-Type`, verbatim — problem+json only if the upstream itself speaks it |
    | Neither header | The request never reached the Broker's error handler — an absent, malformed, expired or untrusted bearer token (`401`), or an intermediary between caller and Broker. | `application/problem+json` without `error_origin`, or whatever the intermediary emits |

    `Jentic-Upstream-Status` is the authoritative signal that a status came
    from the upstream: present means the upstream answered, absent means it
    did not. This matters because most statuses are reachable from both
    origins — a `404` is an unregistered upstream URL from the Broker and a
    missing resource from the upstream; a `429` is the caller's Broker
    rate-limit window or the upstream's own throttle.

    Key recovery on the problem `type` rather than the bare status: one
    status carries types with different retry safety, and one type can
    appear at more than one status. When `agent_directive` is present it is
    a machine-actionable recovery instruction an agent can switch on via
    `agent_directive.strategy` without parsing prose.

    ## Idempotency

    Optional `Idempotency-Key` request header (IETF
    draft-ietf-httpapi-idempotency-key). If present, the Broker claims the
    key before dispatch, records the synchronous response for 24 hours, and
    replays it for any subsequent request that reuses the key — so a retry
    of a timed-out or dropped call cannot execute the upstream twice. Keys
    are scoped per-caller and should be unique per logical operation
    (UUIDv4 recommended, max 255 chars).

    Replays are signalled with `Idempotent-Replayed: true` on the response.
    If the same key is reused with a different request body, method,
    resolved credential or upstream URL, the Broker returns
    `409 idempotency_conflict`; while the first request is still running, a
    reuse returns `409 idempotency_in_progress` with `Retry-After`. Replay
    covers synchronous responses only: a `Prefer: respond-async` call is
    queued before the key is claimed, so re-sending it under the same key
    queues a second job with a new `job_id`.

    ## Proxied upstream headers

    On synchronous responses, upstream API response headers are forwarded
    as-is. Hop-by-hop headers (RFC 7230 §6.1) and the Broker's own
    trace/metadata headers are not proxied — every Broker-added header lives
    under the `Jentic-*` namespace, so `Jentic-*` is unambiguously the
    Broker's and anything else belongs to the upstream.

    ## Revision pinning

    By default the Broker resolves the upstream URL against the target
    API's `current_revision_id` (the `published` revision registered on the
    control plane). To test a `draft` revision with real credentials before
    promoting it, attach the `Jentic-Revision` request header — its
    parameter documentation on `/{upstream_url}` carries the full syntax,
    the errors a bad pin returns, and how pins are recorded for audit.

    ## Security

    The Broker validates every `upstream_url` against the set of registered
    APIs before forwarding. Arbitrary URLs that do not resolve to a known,
    registered API endpoint are rejected with `404` — the Broker is **not**
    an open proxy. This allowlist check is the spec's primary SSRF
    mitigation boundary: credentials are never injected into requests
    targeting unregistered hosts.

    ## Tracing and audit

    Every brokered response carries W3C trace context (`traceparent`,
    `tracestate`) and a `Jentic-*` header layer with the execution ID
    (`exec_…`), the credential used (`Jentic-Credential-Id` /
    `Jentic-Credential-Name`), and the upstream API reference
    (`vendor:name:version`). OpenTelemetry clients pick this up
    automatically; nothing else needs to parse `tracestate`.

    To see what happened, ask the control plane: its execution endpoints
    return a brokered call's metadata (latency, status, pinned revisions,
    caller) and per-step trace, its job endpoints carry async status and
    the upstream-body pickup, and its event feed carries the audit trail.
    The signatures live in the
    [Control API spec](https://control.your-instance.example/openapi.json),
    not here; every record is keyed by the `Jentic-Execution-Id` on the
    brokered response.

    Request and response bodies are not persisted by default. Execution
    metadata is retained for 30 days (configurable). Body capture is
    explicit opt-in. Async response bodies live in a short-lived
    pickup buffer collected via `/jobs/{id}/result`, not in the audit
    store.

servers:
  - url: https://broker.your-instance.example
    description: Production (placeholder — set to your deployment's Broker host)
  - url: https://broker-dev.your-instance.example
    description: Development (placeholder — set to your deployment's Broker host)
tags:
  - name: Executions
    description: |
      Proxy upstream API operations through the Broker, and inspect the
      metadata records they leave behind for audit, latency analysis,
      and failure diagnosis.
  - name: System
    description: |
      Operational endpoints for liveness, readiness, and platform
      observability — not part of the brokered execution surface.
security:
  - BearerAuth: []
  - OAuth2: [capabilities:execute]
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service health probe
      description: |
        Unauthenticated liveness probe for the Broker service. Returns `200`
        with a small JSON body while the process is serving requests,
        reporting the surface name and the running Jentic One release.
        Intended for load balancers, container orchestrators, and uptime
        monitors — not for human or agent consumption beyond green/red
        signalling. Use `/ready` for saturation-aware readiness.
      security: []
      responses:
        "200":
          description: Service is up and serving requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  summary: Broker reporting healthy.
                  value:
                    status: ok
                    surface: broker
                    version: "0.44.0" # x-release-please-version
                notEntitled:
                  summary: Metered marketplace deployment whose entitlement lapsed.
                  value:
                    status: not_entitled
                    reason: Subscription for this deployment is not active.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/Default"
  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: Saturation-aware readiness probe
      description: |
        Readiness probe distinct from liveness (`/health`). Returns `200`
        while the instance can accept traffic and `503` once sustained
        in-flight load nears the admission cap, so a load balancer drains
        *this* instance before it begins shedding requests itself — without
        the pod being restarted (liveness stays green). Intended for the
        orchestrator `readinessProbe`, not for human or agent consumption.
      security: []
      responses:
        "200":
          description: Instance is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              examples:
                ready:
                  summary: Below the saturation threshold.
                  value:
                    status: ready
                    saturation: 0.12
        "503":
          description: Instance is saturated and should be drained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              examples:
                unready:
                  summary: At/above the saturation threshold.
                  value:
                    status: unready
                    reason: saturated
                    saturation: 0.95
        "500":
          $ref: "#/components/responses/ServerError"
        default:
          $ref: "#/components/responses/Default"
  /{upstream_url}:
    parameters:
      - $ref: "#/components/parameters/UpstreamUrl"
      - $ref: "#/components/parameters/Prefer"
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/JenticRevision"
      - $ref: "#/components/parameters/JenticCredentialName"
      - $ref: "#/components/parameters/JenticCredentialId"
    get:
      operationId: executeGet
      summary: Execute a `GET` against an upstream API
      description: |
        Forward a `GET` to the upstream service. No request body. Typically
        used for resource reads and listings; the upstream response is
        returned verbatim on `200`, or queued and surfaced via `202` when
        `Prefer: respond-async` is set (or a `require-approval` rule holds
        the call). A non-2xx is attributed by `Jentic-Error-Origin` — see
        **Reading the response** in the API overview.
      tags: [Executions]
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    post:
      operationId: executePost
      summary: Execute a `POST` against an upstream API
      description: |
        Forward a `POST` to the upstream service. Request body is forwarded
        verbatim — the Broker does not inspect or transform it. The upstream
        response is returned on `200`, or queued and surfaced via `202` when
        `Prefer: respond-async` is set (or a `require-approval` rule holds
        the call). A non-2xx is attributed by `Jentic-Error-Origin` — see
        **Reading the response** in the API overview.
      tags: [Executions]
      requestBody:
        required: false
        description: Request body forwarded verbatim to the upstream service.
        content:
          "*/*":
            schema: {}
            examples:
              create_pet:
                summary: JSON body for the upstream's create operation, forwarded as-is.
                value:
                  name: Rex
                  photoUrls:
                    - https://example.com/rex.jpg
                  status: available
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    put:
      operationId: executePut
      summary: Execute a `PUT` against an upstream API
      description: |
        Forward a `PUT` to the upstream service. Request body is forwarded
        verbatim. Same response semantics as `POST`.
      tags: [Executions]
      requestBody:
        required: false
        description: Request body forwarded verbatim to the upstream service.
        content:
          "*/*":
            schema: {}
            examples:
              replace_pet:
                summary: Full replacement body for the upstream resource, forwarded as-is.
                value:
                  id: 10
                  name: Rex
                  photoUrls:
                    - https://example.com/rex.jpg
                  status: sold
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    patch:
      operationId: executePatch
      summary: Execute a `PATCH` against an upstream API
      description: |
        Forward a `PATCH` to the upstream service. Request body is forwarded
        verbatim. Same response semantics as `POST`.
      tags: [Executions]
      requestBody:
        required: false
        description: Request body forwarded verbatim to the upstream service.
        content:
          "*/*":
            schema: {}
            examples:
              update_issue:
                summary: Partial-update body for the upstream resource, forwarded as-is.
                value:
                  state: closed
                  state_reason: completed
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    delete:
      operationId: executeDelete
      summary: Execute a `DELETE` against an upstream API
      description: |
        Forward a `DELETE` to the upstream service. A request body is
        permitted (RFC 7231 does not forbid one) and forwarded verbatim if
        present, but most upstreams ignore it. Same response semantics as
        `POST`.
      tags: [Executions]
      requestBody:
        required: false
        description: Request body forwarded verbatim to the upstream service.
        content:
          "*/*":
            schema: {}
            examples:
              delete_reason:
                summary: Optional body some upstreams accept on delete, forwarded as-is.
                value:
                  reason: duplicate
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    head:
      operationId: executeHead
      summary: Execute a `HEAD` against an upstream API
      description: |
        Forward a `HEAD` to the upstream service. No request body, no
        response body — only headers. Useful for cheap existence /
        last-modified checks. Async (`202`) is unusual for `HEAD` but
        permitted for parity with the other methods.
      tags: [Executions]
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
    options:
      operationId: executeOptions
      summary: Execute an `OPTIONS` against an upstream API
      description: |
        Forward an `OPTIONS` to the upstream service. Typically used for
        CORS preflight discovery and capability probing. Same response
        semantics as `GET`.
      tags: [Executions]
      responses:
        "200":
          $ref: "#/components/responses/ExecuteSync"
        "202":
          $ref: "#/components/responses/ExecuteAsync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "424":
          $ref: "#/components/responses/CredentialNotProvisioned"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Default"
components:
  headers:
    Traceparent:
      description: |
        W3C Trace Context — `00-{trace-id}-{parent-id}-01`. The
        `parent-id` is the broker span; downstream services use this to
        link their own spans into the same distributed trace. Version
        `00` is current; flags `01` = sampled.
      schema:
        type: string
        examples:
          - 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    Tracestate:
      description: |
        W3C Trace Context vendor extensions. Jentic packs a fixed
        five-field value under the `jentic` vendor key:
        `jentic=<exec_id>:<toolkit_id>:<vendor>:<name>:<version>`, e.g.
        `jentic=exec_xyz789:_:stripe:payments:2023-10-16`. The
        first two segments answer *who is calling*; the trailing
        segments answer *what is being called*. Missing segments are
        emitted as `_` so the shape stays positionally parseable — the
        second segment is a legacy slot (toolkit attribution on the
        pre-theme-5 path, whose tables were dropped in Phase 6b) and is
        always `_` on current executions. Composable with other vendors
        (`jentic=...,datadog=...`).
      schema:
        type: string
        examples:
          - jentic=exec_xyz789:_:stripe:payments:2023-10-16
    JenticExecutionId:
      description: Execution ID — unique identifier for this brokered request.
      schema:
        type: string
        examples:
          - exec_xyz789
    JenticCredentialId:
      description: |
        ID of the stored credential the broker resolved and used to sign
        this execution. Present only when a stored credential was actually
        used — a missing header unambiguously means no credential (inline
        auth, a credential-less API, or a failure before resolution).
      schema:
        type: string
        examples:
          - cred_abc123
    JenticCredentialName:
      description: |
        Human-readable label of the credential in `Jentic-Credential-Id`,
        sanitized to printable ASCII (unsafe characters replaced with `?`).
        Present under the same condition as the id header. The same header
        name is also accepted on requests to disambiguate credential
        resolution.
      schema:
        type: string
        examples:
          - Stripe prod key
    JenticErrorOrigin:
      description: |
        Who generated this error response — `broker` (the Broker itself
        rejected the request, could not resolve or authorize the call, or
        gave up on the upstream) or `upstream` (the external API answered
        with this status and the Broker mirrored it). Mirrors the
        `error_origin` member of a `BrokerProblem` body, and is the only
        attribution signal on a mirrored upstream error, whose body is the
        upstream's own. Absent on an authentication failure, which is
        answered before the Broker's error handler runs, and on `2xx`.
      schema:
        type: string
        enum: [broker, upstream]
        examples:
          - upstream
    JenticUpstreamStatus:
      description: |
        HTTP status code the upstream API returned. Present only when the
        upstream answered, so its presence is the authoritative signal that
        the response status is the upstream's and not the Broker's — a
        Broker-raised problem never carries it.
      schema:
        type: integer
        examples:
          - 404
    ServerTiming:
      description: |
        W3C Server-Timing. The upstream's own `Server-Timing` is forwarded.
        When the deployment enables `broker.server_timing` (off by default),
        the Broker appends a second field for authenticated callers: a
        latency breakdown in milliseconds across the stages that ran, with
        `jentic-upstream` the time spent on the upstream call and
        `jentic-total` the whole brokered request. Names are fixed and
        carry no identifiers and live in the reserved `jentic-` namespace
        (an upstream entry claiming that prefix is dropped). Only the
        stages that ran are listed — the stage set is internal, so read
        the entries present rather than requiring a fixed list.

        The field also appears on post-authentication error responses: with
        durations once the upstream call was attempted (e.g. a `504`, or a
        circuit-open `503` — the breaker check is inside
        `jentic-upstream`), and as stage names only for an error raised
        before it (e.g. `404`, `403`, `409`, `424`). It never appears on
        `401`, a missing-permission `403`, a rate-limit `429` or a
        load-shed `503`.
      schema:
        type: string
        examples:
          - jentic-auth;dur=1.4, jentic-cred;dur=3.0, jentic-upstream;dur=84.2, jentic-total;dur=97.6
  parameters:
    UpstreamUrl:
      name: upstream_url
      in: path
      required: true
      description: The URL of the upstream service to execute the request to.
      example: api.spotify.com/v1/tracks/3n3Ppam7vgaVa1iaRUc9Lp
      schema:
        type: string
        title: Upstream Url
        description: The URL of the upstream service to execute the request to.
        examples:
          - api.spotify.com/v1/tracks/3n3Ppam7vgaVa1iaRUc9Lp
          - petstore.swagger.io/v2/pet/12345
    Prefer:
      name: Prefer
      in: header
      required: false
      description: |
        RFC 7240 processing preference. `respond-async` queues the call and
        returns `202` immediately instead of waiting for the upstream; it is
        the only token the Broker acts on. The preference it applied is
        echoed in `Preference-Applied`.
      example: respond-async
      schema:
        type: string
        examples:
          - respond-async
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional caller-supplied key to make this request idempotent.
        If present, the broker dedupes against the key for 24 hours
        and replays the original response on retry. UUIDv4 recommended.
        See **Idempotency** in the API overview for full semantics.
      example: 5f9c8b2e-7a4d-4e1f-9c3a-1b2d3e4f5a6b
      schema:
        type: string
        maxLength: 255
        examples:
          - 5f9c8b2e-7a4d-4e1f-9c3a-1b2d3e4f5a6b
    JenticRevision:
      name: Jentic-Revision
      in: header
      required: false
      description: |
        Pin upstream-API resolution to a specific `ApiRevision`
        instead of the API's `current_revision_id`. Multi-valued —
        repeat the header (or comma-separate) once per API you
        want to pin. Each value is `vendor:name:version=<revision_id>`:
        `vendor`, `name` and `version` are the API's `api` reference,
        and `<revision_id>` is the revision's `revision_id` exactly as
        the control plane returns it (`GET
        /apis/{vendor}/{name}/{version}/revisions`, the revision get,
        an import job's result, or `jentic apis revisions`). The
        equivalent `rev_<revision_id without hyphens>` label is
        accepted too.

        Use cases:

        - Test a `draft` revision against existing credentials
          before promoting it.
        - Reproduce a historical execution against an `archived`
          spec for diagnostic purposes (refused: archived revisions
          are deliberately not pinnable from the hot path — resurrect
          them by re-promoting instead).

        The Broker forwards the pin into the control-plane
        `POST /lookup/operation` call so URL → `operation_id`
        resolution sees the requested spec. When the header is
        absent or the URL doesn't match a pinned API, the Broker
        resolves against `current_revision_id` as today.

        Pinning a `draft` revision the caller doesn't have
        access to returns `403`. Pinning an unknown or
        `archived` revision returns `422`. Pinning the same API
        to two different revisions in one header returns
        `422 invalid_revision_pin`; repeating the same revision
        (in either form) is allowed. The chosen revisions
        are recorded on the resulting `ExecutionRecord`
        (`pinned_revisions` field on the control plane), so audit
        can answer "did this execution use a pinned revision?"
        without parsing headers.
      example:
        - stripe:payments:2023-10-16=3f2b8c1e-7d4a-4e9b-a6c5-1d2e3f4a5b6c
      schema:
        type: array
        items:
          type: string
          pattern: '^[a-z0-9-]+:[^=:]+:[^=]+=(?:rev_[0-9A-Fa-f]{32}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$'
        examples:
          - - stripe:payments:2023-10-16=3f2b8c1e-7d4a-4e9b-a6c5-1d2e3f4a5b6c
          - - stripe:payments:2023-10-16=rev_3f2b8c1e7d4a4e9ba6c51d2e3f4a5b6c
            - shopify:admin:2024-01=8a1d4c2e-5b6f-4a7e-9c3d-2e1f0a9b8c7d
      style: simple
      explode: false
    JenticCredentialName:
      name: Jentic-Credential-Name
      in: header
      required: false
      description: |
        Disambiguate credential resolution by the credential's
        human-readable name. When several bound credentials cover the
        target API at the same specificity (a multi-account setup), the
        broker refuses with `409 ambiguous_credential_binding` and lists
        the candidates; resend with this header naming the one to use. A
        name that matches no covering candidate is rejected with
        `400 credential_name_not_found` (candidates listed). Consumed by
        the broker — never forwarded upstream. The same header name is
        also emitted on responses to attribute the credential used.
      example: Stripe prod key
      schema:
        type: string
        examples:
          - Stripe prod key
    JenticCredentialId:
      name: Jentic-Credential-Id
      in: header
      required: false
      description: |
        Disambiguate credential resolution by exact credential id — the
        authoritative signal, applied before the name filter and
        specificity narrowing. Ids are stable and non-secret
        (`cred_`-prefixed); the `409 ambiguous_credential_binding`
        candidate list carries them. An id that matches no covering,
        bound candidate is rejected with `400 credential_id_not_found`
        (candidates listed). Consumed by the broker — never forwarded
        upstream. The same header name is also emitted on responses to
        attribute the credential used.
      example: cred_abc123
      schema:
        type: string
        examples:
          - cred_abc123
  schemas:
    BrokerProblem:
      title: BrokerProblem
      description: |
        RFC 9457 Problem Details body for every Broker error. Extends the
        shared Jentic `ProblemDetails` schema with the Broker's
        agent-recovery members: `error_origin` says *who* failed, and
        `agent_directive` (when present) is a machine-actionable recovery
        instruction an agent can follow without parsing prose. `title`
        repeats `detail` on Broker-originated errors.

        This body is emitted for errors the Broker raises. An error the
        upstream returns is mirrored verbatim in the upstream's own format,
        so a non-2xx carries this shape only when `Jentic-Error-Origin` is
        `broker` (or absent, on an authentication failure) — see **Reading
        the response** in the API overview.
      examples:
        - type: no_credential_binding
          title: No credential binding for this API
          status: 403
          detail: No credential binding for this API
          error_origin: broker
          instance: /api.example.com/v1/users
      allOf:
        - $ref: 'https://raw.githubusercontent.com/jentic/api-problem-details/c741877182d2deea2bb38859e3df4caa76265d98/schemas/problem-details.yaml'
        - type: object
          required:
            - type
            - title
            - status
            - detail
          properties:
            type:
              type: string
              description: |
                Problem type — a stable, machine-readable token naming the
                failure (`no_credential_binding`, `idempotency_conflict`,
                `upstream_timeout`, …), not a dereferenceable URI. Key
                recovery on this rather than on the bare status. Errors with
                no specific type (an overridden framework `404`/`405`, an
                unhandled failure) carry `about:blank`; a request-validation
                failure carries `about:blank#validation` with the field
                details in `errors[]`.
              examples:
                - no_credential_binding
            title:
              type: string
              description: |
                Short summary of the problem type. On Broker-originated
                errors it repeats `detail` verbatim, so a caller that reads
                either member gets the same message.
              examples:
                - No credential binding for this API
            status:
              type: integer
              description: |
                HTTP status code of this response, repeated in the body.
                Broker-raised, so it is never a mirrored upstream status —
                those arrive with the upstream's own body and a
                `Jentic-Upstream-Status` header.
              examples:
                - 403
            detail:
              type: string
              description: |
                Occurrence-specific explanation, safe to show a human.
                Carries no secret material and never echoes the submitted
                request values.
              examples:
                - No credential binding for this API
            instance:
              type: string
              description: |
                The request path that failed — the `/{upstream_url}` path
                component only. The query string is deliberately omitted
                because an upstream URL's query can carry secrets. Absent on
                errors raised with no request context (rate-limit and
                load-shed refusals).
              examples:
                - /api.example.com/v1/users
            error_origin:
              type: string
              enum: [broker, upstream]
              description: |
                Who generated the error response: `broker` (the Broker
                itself — overloaded, misconfigured, rejecting the request
                shape, or giving up on the call: an upstream timeout, a
                dropped or refused upstream connection, the overall
                deadline, a failed token refresh, an oversized upstream
                response) or `upstream` (the external API answered with
                this error and the Broker mirrored it). Mirrored in the
                `Jentic-Error-Origin` response header. Absent on
                authentication errors.
              examples:
                - broker
            agent_directive:
              $ref: "#/components/schemas/AgentDirective"
            candidates:
              type: array
              description: |
                The caller's own credentials that matched ambiguously
                (`ambiguous_credential_binding`, `ambiguous_credential`) or
                that a credential-selection header failed to match
                (`credential_id_not_found`, `credential_name_not_found`).
                Pick one and resend with `Jentic-Credential-Id`.
              examples:
                - - id: cred_01HXAMPLE7Q2
                    name: github-work
                    last4: 7Q2a
                    created_at: "2026-09-01T00:00:00Z"
              items:
                $ref: "#/components/schemas/CredentialCandidate"
            allowed_methods:
              type: array
              description: |
                The HTTP methods the upstream URL is registered for, on a
                `method_not_allowed` 405. Mirrored in the `Allow` response
                header.
              examples:
                - [GET, PUT]
              items:
                type: string
            intent_id:
              type: string
              description: |
                Correlation id for a `credential_not_provisioned` denial,
                also carried in `agent_directive.parameters.intent_id`, so
                the human hand-off can be tied back to this request.
              examples:
                - intent_3f2a9c0d1b8e4f6a9d7c5b3e1a0f2d4c
            max_response_bytes:
              type: integer
              description: |
                The response-size cap the upstream body exceeded, on an
                `upstream_response_too_large` 502.
              examples:
                - 10485760
    AgentDirective:
      type: object
      title: AgentDirective
      description: |
        Machine-actionable recovery instruction embedded in a Broker
        problem body. The fixed `strategy` vocabulary lets an agent
        hard-code its recovery loop — e.g. on `wait` sleep
        `parameters.retry_after_seconds`; on `modify_headers` add
        `parameters.headers` and retry once; on `prompt_human` stop and
        relay `human_readable_instruction` to the user.
      examples:
        - strategy: modify_headers
          parameters:
            candidates: [cred_01HXAMPLE7Q2, cred_01HXAMPLE9K4]
            headers:
              Jentic-Credential-Id: cred_01HXAMPLE7Q2
          human_readable_instruction: >-
            Multiple bound credentials cover this API. Resend the same request
            with the Jentic-Credential-Id header set to one of the ids in
            parameters.candidates (Jentic-Credential-Name also works when names
            are unique).
      required:
        - strategy
        - parameters
        - human_readable_instruction
      properties:
        strategy:
          type: string
          enum: [wait, retry, modify_headers, prompt_human, switch_toolkit, fatal]
          description: Recovery strategy the agent should apply.
          examples:
            - modify_headers
        parameters:
          type: object
          additionalProperties: true
          description: |
            Strategy-specific inputs (e.g. `headers` for `modify_headers`,
            `retry_after_seconds` for `wait`, `intent_id` / `provisioning_url`
            for `prompt_human`). Empty when the strategy needs none.
          examples:
            - headers:
                Jentic-Credential-Id: cred_01HXAMPLE7Q2
        human_readable_instruction:
          type: string
          description: Plain-language instruction an agent can relay to a human or follow itself.
          examples:
            - Resend the same request with the Jentic-Credential-Id header set to one of the ids in parameters.candidates.
    CredentialCandidate:
      type: object
      title: CredentialCandidate
      description: |
        One of the caller's own credentials, distinguishable even when names
        collide. Holds no secret material — `last4` is the last four
        characters of the credential **id**.
      examples:
        - id: cred_01HXAMPLE7Q2
          name: github-work
          last4: 7Q2a
          created_at: "2026-09-01T00:00:00Z"
      required:
        - id
        - name
        - last4
      properties:
        id:
          type: string
          description: Stable credential id; send it as `Jentic-Credential-Id` to pick this credential.
          examples:
            - cred_01HXAMPLE7Q2
        name:
          type: string
          description: Credential display name (not guaranteed unique).
          examples:
            - github-work
        last4:
          type: string
          description: Last four characters of the credential id, as a display hint.
          examples:
            - 7Q2a
        created_at:
          type: [string, "null"]
          format: date-time
          description: When the credential was created, to tell same-named candidates apart.
          examples:
            - "2026-09-01T00:00:00Z"
    AsyncQueuedResponse:
      type: object
      title: AsyncQueuedResponse
      description: |
        Handle returned when the Broker queues an upstream call for async
        execution — the `202` body on an async execution. The Broker
        does not expose a polling surface of its own; `_links.self`
        is an absolute URL into the platform's control plane, where
        the queued work surfaces as a `kind: execution` job. Poll
        that URL for status, and follow its `_links.result` to
        collect the upstream response body once `status` is
        `completed`.
      examples:
        - status: queued
          job_id: job_abc123
          _links:
            self: https://control.your-instance.example/jobs/job_abc123
      required:
        - status
        - job_id
        - _links
      properties:
        status:
          type: string
          title: Status
          description: Always `queued` on this body; a call held for approval answers `held` instead.
          enum: [queued]
          examples:
            - queued
        job_id:
          type: string
          title: Job Id
          description: Unique identifier for the queued job. Matches the `job_id` reported by the control plane.
          examples:
            - job_abc123
        _links:
          type: object
          title: AsyncQueuedResponseLinks
          description: |
            HAL-style link relations pointing into the control-plane job
            record for the queued job. `self` always
            points at the control-plane job record; the broker does
            not expose its own polling surface.
          examples:
            - self: https://control.your-instance.example/jobs/job_abc123
          required:
            - self
          properties:
            self:
              type: string
              format: uri
              description: Absolute URL of the control-plane job record. Poll this for status and result links.
              examples:
                - https://control.your-instance.example/jobs/job_abc123
    HeldExecutionAcceptedResponse:
      type: object
      title: HeldExecutionAcceptedResponse
      description: |
        Handle returned when a permission rule holds the call for human
        approval — the `202` body when the call matches a permission rule
        with `effect: require-approval`. The call has not run: it waits
        until a reviewer (the agent's owner or an `org:admin`) approves or
        denies it on `review_url`, or it expires. Follow `_links.self`
        (`/executions/holds/{held_execution_id}`) to see where it stands;
        once it has finished, `_links.result` returns the upstream response,
        or the problem explaining why it never ran (denied, expired, or
        refused at run time). To abandon the call, `POST` to
        `_links.withdraw`. Never re-send the call: an identical call while
        one is pending joins the same held execution.
      required:
        - status
        - held_execution_id
        - review_url
        - expires_at
        - agent_directive
        - _links
      properties:
        status:
          type: string
          enum: [held]
          description: Always `held`.
        held_execution_id:
          type: string
          description: The held execution.
          examples:
            - held_abc123
        review_url:
          type: string
          format: uri
          description: Review page; the reviewer signs in to decide. Carries no credential.
          examples:
            - https://your-instance.example/app/agents/approvals/held_abc123
        expires_at:
          type: string
          format: date-time
          description: When the call expires undecided and fails.
        agent_directive:
          allOf:
            - $ref: "#/components/schemas/AgentDirective"
          description: |
            What the calling agent should do next, in the same
            `AgentDirective` shape a problem body carries — so one branch on
            `agent_directive.strategy` covers both the error path and this
            one. Always `prompt_human` here: the call cannot proceed without
            a reviewer, and `human_readable_instruction` is the message to
            relay.
        _links:
          type: object
          required: [self, result, withdraw]
          properties:
            self:
              type: string
              description: The held execution — its decision and where the call stands.
              examples:
                - https://control.your-instance.example/executions/holds/held_abc123
            result:
              type: string
              description: The call's outcome, once it has finished.
              examples:
                - https://control.your-instance.example/executions/holds/held_abc123/result
            withdraw:
              type: string
              description: |
                `POST` here to withdraw the call before it is decided (only
                the agent that made the call may). The call never runs.
              examples:
                - https://control.your-instance.example/executions/holds/held_abc123:withdraw
    HealthResponse:
      type: object
      title: HealthResponse
      description: |
        Service health probe response — the body returned by `GET /health`
        while the Broker process is
        serving requests. Intentionally minimal — clients treat `200` +
        `status: ok` as the green signal; the body is informational.
      examples:
        - status: ok
          surface: broker
          version: "0.44.0" # x-release-please-version
      required:
        - status
      properties:
        status:
          type: string
          description: |
            `ok` while the process is serving requests. A metered
            marketplace deployment whose entitlement lapsed answers
            `not_entitled` (still HTTP `200`, so orchestrators don't
            restart it).
          enum: [ok, not_entitled]
          examples:
            - ok
        surface:
          type: string
          description: Name of the surface reporting health; always `broker`. Absent on the `not_entitled` body.
          examples:
            - broker
        version:
          type: string
          description: |
            Running Jentic One release (the same version as `info.version`
            in this spec). Absent on the `not_entitled` body.
          examples:
            - "0.44.0" # x-release-please-version
        reason:
          type: string
          description: Why the deployment is not entitled. Present only on the `not_entitled` body.
          examples:
            - Subscription for this deployment is not active.
    ReadinessResponse:
      type: object
      title: ReadinessResponse
      description: |
        Saturation-aware readiness probe response — the body returned by
        `GET /ready`. `status: ready` (HTTP `200`) means the
        instance is below the saturation threshold; `status: unready` (HTTP
        `503`) means in-flight load is at/near the admission cap and the load
        balancer should drain this instance. `saturation` is the current
        in-flight count as a fraction of the configured cap.
      examples:
        - status: ready
          saturation: 0.12
      required:
        - status
      properties:
        status:
          type: string
          description: |
            `ready` while in-flight load is below the saturation threshold
            (HTTP `200`); `unready` once it nears the admission cap (HTTP
            `503`) and the load balancer should drain this instance.
          enum: [ready, unready]
          examples:
            - ready
        reason:
          type: string
          description: Why the instance is unready (present only on `unready`).
          enum: [saturated, draining]
          examples:
            - saturated
        saturation:
          type: number
          format: float
          minimum: 0
          description: |
            In-flight requests as a fraction of the admission cap (`0`–`1`,
            briefly above `1` at the cap edge). Omitted when the instance is
            `draining`.
          examples:
            - 0.12
  responses:
    ExecuteSync:
      description: |
        Synchronous success — upstream responded within the wait window.
        The response body and status code are forwarded from the upstream
        API.

        Upstream response headers are forwarded as-is; broker-added
        metadata is confined to the `Jentic-*` namespace.
      headers:
        Preference-Applied:
          description: RFC 7240 — confirms which processing preference was applied.
          schema:
            type: string
            examples:
              - respond-async
        Idempotent-Replayed:
          description: |
            Present and `true` when this response was replayed from a
            stored `Idempotency-Key` rather than freshly executed.
            Absent on first execution.
          schema:
            type: string
            enum: ["true"]
            examples:
              - "true"
        Jentic-Api-Vendor:
          description: API vendor hostname that was called.
          schema:
            type: string
            examples:
              - api.spotify.com
        traceparent:
          $ref: "#/components/headers/Traceparent"
        tracestate:
          $ref: "#/components/headers/Tracestate"
        Jentic-Execution-Id:
          $ref: "#/components/headers/JenticExecutionId"
        Jentic-Operation:
          description: Name of the operation that was executed.
          schema:
            type: string
            examples:
              - getTrack
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
        Jentic-Credential-Id:
          $ref: "#/components/headers/JenticCredentialId"
        Jentic-Credential-Name:
          $ref: "#/components/headers/JenticCredentialName"
        Server-Timing:
          $ref: "#/components/headers/ServerTiming"
      content:
        "*/*":
          schema:
            title: UpstreamBody
            description: |
              Upstream response body forwarded by the Broker, verbatim.
              Content type varies by upstream API — may be JSON, XML,
              binary, or any other media type. The `Content-Type` header on
              the response reflects what the upstream returned.
          examples:
            spotify_track:
              summary: Forwarded `200` body from Spotify's `getTrack` (JSON).
              value:
                id: 3n3Ppam7vgaVa1iaRUc9Lp
                name: Mr. Brightside
                duration_ms: 222200
                explicit: false
    ExecuteAsync:
      description: |
        Execution queued — or held for human approval when a
        `require-approval` permission rule matched (`status: held`; see
        `HeldExecutionAcceptedResponse`). For a queued call, follow
        `_links.self` to the control plane to poll the job and collect the
        upstream response body once `status` is `completed`. The body is
        delivered once and then evicted from the platform's pickup buffer.

        A `202` is never an idempotent replay: queueing happens before the
        `Idempotency-Key` is claimed, so re-sending the call with the same
        key queues a second job under a new `job_id`.
      headers:
        Preference-Applied:
          description: RFC 7240 — confirms which processing preference was applied.
          schema:
            type: string
            examples:
              - respond-async
        Jentic-Api-Vendor:
          description: API vendor hostname that was called.
          schema:
            type: string
            examples:
              - api.spotify.com
        traceparent:
          $ref: "#/components/headers/Traceparent"
        tracestate:
          $ref: "#/components/headers/Tracestate"
        Jentic-Execution-Id:
          $ref: "#/components/headers/JenticExecutionId"
        Jentic-Operation:
          description: Name of the operation that was executed.
          schema:
            type: string
            examples:
              - getTrack
        Server-Timing:
          $ref: "#/components/headers/ServerTiming"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AsyncQueuedResponse"
              - $ref: "#/components/schemas/HeldExecutionAcceptedResponse"
            discriminator:
              propertyName: status
              mapping:
                queued: "#/components/schemas/AsyncQueuedResponse"
                held: "#/components/schemas/HeldExecutionAcceptedResponse"
          examples:
            queued:
              summary: Freshly queued async execution.
              value:
                status: queued
                job_id: job_abc123
                _links:
                  self: https://control.your-instance.example/jobs/job_abc123
            held:
              summary: Call held for human approval by a require-approval rule.
              value:
                status: held
                held_execution_id: held_abc123
                review_url: https://your-instance.example/app/agents/approvals/held_abc123
                expires_at: "2026-10-06T12:00:00Z"
                agent_directive:
                  strategy: prompt_human
                  parameters:
                    held_execution_id: held_abc123
                    review_url: https://your-instance.example/app/agents/approvals/held_abc123
                  human_readable_instruction: >-
                    This call needs human approval. Most important: show the user the review_url,
                    since they cannot approve it without that link, and end your turn so they see it.
                    Do not call get_execution_result until the user replies; then call it once with
                    held_execution_id. It waits up to 30 seconds (timeout, at most 30). If it is
                    still held, show the user the review_url again and end your turn again. Do not
                    re-send the call.
                _links:
                  self: https://control.your-instance.example/executions/holds/held_abc123
                  result: https://control.your-instance.example/executions/holds/held_abc123/result
                  withdraw: https://control.your-instance.example/executions/holds/held_abc123:withdraw
    BadRequest:
      description: |
        Request rejected before reaching the upstream — malformed JSON,
        missing required field, or schema-validation failure on the
        broker side. Body is RFC 9457 `application/problem+json` using
        the shared `ProblemDetails` schema.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            invalid_upstream_url:
              summary: Upstream URL rejected by the broker's egress policy.
              value:
                type: invalid_upstream_url
                title: upstream URL resolves to a blocked address range
                status: 400
                detail: upstream URL resolves to a blocked address range
                error_origin: broker
                instance: /169.254.169.254/latest/meta-data
    Unauthorized:
      description: |
        Authentication missing or invalid — the `Authorization: Bearer
        <token>` credential is absent, malformed, expired, revoked, or
        (for JWTs) signed by an issuer the Broker doesn't trust. Body is
        RFC 9457 `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            invalid_token:
              summary: Token missing, unknown, revoked, or expired.
              value:
                type: unauthorized
                title: Unauthorized
                status: 401
                detail: Invalid or expired access token
                instance: /api.example.com/v1/users
    Forbidden:
      description: |
        Caller authenticated but not entitled to execute — most often a
        token lacking the required `capabilities:execute` permission
        (`type: insufficient_scope`, the RFC 6750 code), attempting to pin a `draft`
        revision they don't own, using a credential they aren't bound to
        (`no_credential_binding`), holding only a suspended binding for the
        API (`credential_binding_suspended`), or being denied by a binding's
        permission rules. Body is RFC 9457 `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            insufficient_scope:
              summary: Token lacks the `capabilities:execute` permission.
              value:
                type: insufficient_scope
                title: Forbidden
                status: 403
                detail: "Insufficient scope: 'capabilities:execute' required"
                instance: /api.example.com/v1/users
            no_credential_binding:
              summary: Caller is not bound to any credential covering this API.
              value:
                type: no_credential_binding
                title: No credential binding for this API
                status: 403
                detail: No credential binding for this API
                error_origin: broker
                instance: /api.example.com/v1/users
                agent_directive:
                  strategy: prompt_human
                  parameters:
                    api:
                      vendor: api.example.com
                      name: main
                      version: "1.0.0"
                    api_served: true
                  human_readable_instruction: >-
                    You have no credential binding for 'api.example.com/main', but a
                    credential already serves it. Ask your operator to bind this agent
                    to that credential (in the dashboard, or via POST
                    /agents/{agent_id}/credentials) — only a human can grant the
                    binding. Once bound, retry this call.
            credential_binding_suspended:
              summary: The caller's binding for this API is suspended by its operator.
              value:
                type: credential_binding_suspended
                title: The credential binding for this API is suspended
                status: 403
                detail: The credential binding for this API is suspended
                error_origin: broker
                instance: /api.example.com/v1/users
                agent_directive:
                  strategy: prompt_human
                  parameters:
                    api:
                      vendor: api.example.com
                      name: main
                      version: "1.0.0"
                  human_readable_instruction: >-
                    Your operator has suspended your access to 'api.example.com/main'.
                    Ask your operator whether they will resume it — only they can. Do
                    not request a new connection for this API. Once they resume it,
                    retry this call.
    NotFound:
      description: |
        The upstream URL doesn't resolve to a registered API operation
        (`operation_not_found`): the Broker answers before dispatch with an
        RFC 9457 `application/problem+json` body and
        `Jentic-Error-Origin: broker`.

        A `404` the upstream itself returns — the path refers to a resource
        it doesn't recognise — is mirrored instead: the upstream's status,
        body and `Content-Type` pass through verbatim, tagged
        `Jentic-Error-Origin: upstream` with `Jentic-Upstream-Status: 404`.
        That body is the upstream's own shape, not problem+json.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            operation_not_found:
              summary: Upstream URL does not match any registered API operation.
              value:
                type: operation_not_found
                title: Operation not found — unregistered upstream URL.
                status: 404
                detail: Operation not found — unregistered upstream URL.
                error_origin: broker
                instance: /api.example.com/v1/unknown
    MethodNotAllowed:
      description: |
        The upstream URL matches a registered API operation, but not for
        the request's HTTP method (`method_not_allowed`). The broker answers
        before dispatch, so the upstream never saw the call. The `Allow`
        header and the `allowed_methods` member name the methods the URL
        is registered for; resend with one of them. Body is RFC 9457
        `application/problem+json` with `Jentic-Error-Origin: broker`. A
        `405` the upstream itself returns is mirrored instead — its body and
        `Content-Type` verbatim, tagged `Jentic-Error-Origin: upstream` with
        `Jentic-Upstream-Status: 405` — so the `Allow` header and
        `allowed_methods` member below describe only the Broker's own `405`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
        Allow:
          description: Comma-separated HTTP methods the upstream URL is registered for.
          schema:
            type: string
            examples:
              - GET, PUT
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            method_not_allowed:
              summary: The URL is registered only for other HTTP methods.
              value:
                type: method_not_allowed
                title: "Method not allowed; allowed: GET, PUT"
                status: 405
                detail: "Method not allowed; allowed: GET, PUT"
                error_origin: broker
                instance: /api.example.com/v1/widgets
                allowed_methods: [GET, PUT]
    Conflict:
      description: |
        Conflict (RFC 9457 `application/problem+json`), distinguished by
        the problem `type`:

        - `ambiguous_credential_binding` — several credentials the caller
          is bound to cover the target API at the same specificity. The
          body lists the candidates (`id`, `name`, `last4`, `created_at`);
          resend with the `Jentic-Credential-Name` or `Jentic-Credential-Id`
          request header to pick one.
        - `idempotency_conflict` — the same `Idempotency-Key` was already
          used with a different request (method, upstream URL, resolved
          credential, or body). Reusing a key for a different request is
          rejected; pick a new key.
        - `idempotency_in_progress` — a request with this `Idempotency-Key`
          is still being processed. The response carries a `Retry-After`
          header; retry after that delay to obtain the replayed result.
        - `ambiguous_match` — the upstream URL matches more than one
          registered operation with equal specificity, so the broker cannot
          tell which API the call is for. Raised before dispatch; the
          registered specs overlap and need an operator fix (or a
          `Jentic-Revision` pin that disambiguates).
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            ambiguous_credential_binding:
              summary: Two bound credentials cover the API; pick one with a header.
              value:
                type: ambiguous_credential_binding
                title: "Ambiguous: 2 active credentials match api (api.github.com, main, 1.1.4)"
                status: 409
                detail: "Ambiguous: 2 active credentials match api (api.github.com, main, 1.1.4)"
                error_origin: broker
                instance: /api.github.com/user/repos
                candidates:
                  - id: cred_01HXAMPLE7Q2
                    name: github-work
                    last4: 7Q2a
                    created_at: "2026-09-01T00:00:00Z"
                  - id: cred_01HXAMPLE9K4
                    name: github-personal
                    last4: 9K4b
                    created_at: "2026-09-12T00:00:00Z"
                agent_directive:
                  strategy: modify_headers
                  parameters:
                    candidates: [cred_01HXAMPLE7Q2, cred_01HXAMPLE9K4]
                    headers:
                      Jentic-Credential-Id: cred_01HXAMPLE7Q2
                  human_readable_instruction: >-
                    Multiple bound credentials cover this API. Resend the same request
                    with the Jentic-Credential-Id header set to one of the ids in
                    parameters.candidates (Jentic-Credential-Name also works when names
                    are unique).
            idempotency_conflict:
              summary: Idempotency-Key reused with a different request.
              value:
                type: idempotency_conflict
                title: Idempotency-Key reused with a different request.
                status: 409
                detail: Idempotency-Key reused with a different request.
                error_origin: broker
                instance: /api.example.com/v1/orders
            ambiguous_match:
              summary: The upstream URL matches several registered operations equally.
              value:
                type: ambiguous_match
                title: "Ambiguous URL match: 2 candidates with equal specificity"
                status: 409
                detail: "Ambiguous URL match: 2 candidates with equal specificity"
                error_origin: broker
                instance: /api.example.com/v1/widgets
    CredentialNotProvisioned:
      description: |
        A bound credential is an unusable dependency, so the broker cannot
        sign the upstream call. Body is RFC 9457
        `application/problem+json`; the `type` discriminates three cases with
        different recovery paths:
        - `credential_not_provisioned` — no credential is connected for the
          resolved upstream API. The `agent_directive` is a `prompt_human`
          instruction carrying an `intent_id` correlation id, so an
          autonomous agent stops and asks the user to connect the account
          rather than retrying or guessing the credential. When the agent
          already has an open connect session for the API, the directive
          also carries a non-secret `provisioning_url` — that session's
          owner approval link (`/app/agents?approve=<session_id>`) — for
          the agent to relay instead of starting another connect.
        - `credential_undecryptable` — a credential is connected but its
          stored secret can no longer be decrypted (typically the
          deployment's encryption key rotated underneath it, e.g. a
          reinstall over existing data). The caller cannot self-provision
          and retrying will not help; the `prompt_human` directive tells
          the agent to ask an operator to remove and re-add the credential.
        - `credential_needs_reconnect` — a credential is connected but the
          broker's own OAuth refresh against the vendor was rejected
          (`invalid_grant`): the stored upstream grant was revoked or
          expired beyond refresh. **The caller's own access token is
          fine — do not re-authenticate and do not discard it.** Only
          reconnecting the upstream credential fixes this, so the
          `prompt_human` directive asks the user to reconnect the account.
          This answers `424` rather than `401` precisely so a client does
          not mistake it for its own credential being rejected.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            credential_not_provisioned:
              summary: No credential connected for the API; ask a human to connect one.
              value:
                type: credential_not_provisioned
                title: No credential provisioned for 'api.example.com'.
                status: 424
                detail: No credential provisioned for 'api.example.com'.
                error_origin: broker
                instance: /api.example.com/v1/users
                intent_id: intent_3f2a9c0d1b8e4f6a9d7c5b3e1a0f2d4c
                agent_directive:
                  strategy: prompt_human
                  parameters:
                    intent_id: intent_3f2a9c0d1b8e4f6a9d7c5b3e1a0f2d4c
                    vendor: api.example.com
                  human_readable_instruction: >-
                    No credential is connected for 'api.example.com'; ask the user to
                    connect the account before retrying.
    ValidationError:
      description: |
        Request well-formed but semantically invalid — e.g. unknown
        revision pin, archived revision pin, or a request body that
        fails the upstream operation's schema. Field-level details
        live in the `errors[]` extension of the
        `application/problem+json` body.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            unknown_revision_pin:
              summary: Jentic-Revision pins a revision that does not exist.
              value:
                type: unknown_revision_pin
                title: "Unknown revision pin: stripe:payments:2023-10-16=3f2b8c1e-7d4a-4e9b-a6c5-1d2e3f4a5b6c"
                status: 422
                detail: "Unknown revision pin: stripe:payments:2023-10-16=3f2b8c1e-7d4a-4e9b-a6c5-1d2e3f4a5b6c"
                error_origin: broker
                instance: /api.example.com/v1/users
            invalid_revision_pin:
              summary: A Jentic-Revision value is not of the form vendor:name:version=<revision_id>.
              value:
                type: invalid_revision_pin
                title: "Malformed Jentic-Revision value: 'stripe:payments:2023-10-16=latest' (expected vendor:name:version=<revision_id>, with the revision_id from GET /apis/{vendor}/{name}/{version}/revisions)"
                status: 422
                detail: "Malformed Jentic-Revision value: 'stripe:payments:2023-10-16=latest' (expected vendor:name:version=<revision_id>, with the revision_id from GET /apis/{vendor}/{name}/{version}/revisions)"
                error_origin: broker
                instance: /api.example.com/v1/users
    TooManyRequests:
      description: |
        Caller exceeded their rate-limit window. Retry after the
        interval indicated by `Retry-After`; the
        `RateLimit-*` headers describe the current quota and
        remaining budget per RFC 6648 / `draft-ietf-httpapi-ratelimit-headers`.
        Body is RFC 9457 `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
        RateLimit-Limit:
          description: Total number of requests allowed in the current window.
          schema:
            type: integer
            examples:
              - 100
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            examples:
              - 0
        Retry-After:
          description: |
            Seconds to wait before retrying, per RFC 7231 §7.1.3.
            May also be sent as an HTTP-date.
          schema:
            type: string
            examples:
              - "30"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            rate_limit_exceeded:
              summary: Caller exhausted their per-actor rate-limit window.
              value:
                type: rate_limit_exceeded
                title: Rate limit exceeded; slow down and retry after the indicated delay.
                status: 429
                detail: Rate limit exceeded; slow down and retry after the indicated delay.
                error_origin: broker
    ServerError:
      description: |
        Unexpected broker-side failure — a bug, a panic, or an outbound
        request the broker itself built and could not send
        (`upstream_request_invalid`, e.g. an injected credential header
        with an illegal byte; fix the stored credential rather than
        retrying). Should be rare; report with the `traceparent` header
        for triage. Body is RFC 9457 `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            server_error:
              summary: Unhandled broker-side failure (details are logged, never echoed).
              value:
                type: server_error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                instance: /api.example.com/v1/users
            upstream_request_invalid:
              summary: >-
                The broker built an outbound request its HTTP client refused to send
                (e.g. an injected credential header carrying an illegal byte); fix the
                stored credential rather than retrying.
              value:
                type: upstream_request_invalid
                title: Upstream transport error (LocalProtocolError)
                status: 500
                detail: Upstream transport error (LocalProtocolError)
                error_origin: broker
                instance: /api.example.com/v1/users
    ServiceUnavailable:
      description: |
        Broker temporarily unable to serve traffic — startup,
        shutdown, dependency outage, or a deliberate maintenance
        window. Retry after the interval indicated by `Retry-After`.
        Body is RFC 9457 `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
        Retry-After:
          description: |
            Seconds to wait before retrying, per RFC 7231 §7.1.3.
            May also be sent as an HTTP-date.
          schema:
            type: string
            examples:
              - "60"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            server_at_capacity:
              summary: Instance shed the request at its in-flight admission cap.
              value:
                type: server_at_capacity
                title: Server at capacity; retry shortly.
                status: 503
                detail: Server at capacity; retry shortly.
                error_origin: broker
            circuit_open:
              summary: Upstream circuit breaker is open; the broker is fast-failing.
              value:
                type: circuit_open
                title: Upstream circuit open; the broker is fast-failing to let it recover.
                status: 503
                detail: Upstream circuit open; the broker is fast-failing to let it recover.
                error_origin: broker
            idempotency_unavailable:
              summary: The Idempotency-Key claim could not be recorded, so the request was not executed.
              value:
                type: idempotency_unavailable
                title: The Idempotency-Key claim could not be recorded, so the request was not executed; retry after the indicated delay.
                status: 503
                detail: The Idempotency-Key claim could not be recorded, so the request was not executed; retry after the indicated delay.
                error_origin: broker
            too_many_candidates:
              summary: The URL index returned more candidates than the broker can rank; nothing was dispatched.
              value:
                type: too_many_candidates
                title: URL index returned too many candidates
                status: 503
                detail: URL index returned too many candidates
                error_origin: broker
                instance: /api.example.com/v1/widgets
    PayloadTooLarge:
      description: |
        Request body exceeded the broker's per-`Content-Type` size cap
        (`max_request_bytes_by_type`, falling back to `max_request_bytes`).
        The cap is resolved from the request `Content-Type` before the body is
        read, so an over-cap upload fails fast. Body is RFC 9457
        `application/problem+json`.
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            payload_too_large:
              summary: Request body exceeded the per-Content-Type size cap.
              value:
                type: payload_too_large
                title: Request body exceeds the 10485760-byte cap.
                status: 413
                detail: Request body exceeds the 10485760-byte cap.
                error_origin: broker
                instance: /api.example.com/v1/uploads
    Default:
      description: |
        Catch-all problem+json response for any status not enumerated on
        this operation. Key recovery on the problem `type`, not the bare
        status: one status can carry types with different retry safety
        (a 502 `upstream_connect_failed` is safe to retry for any method;
        a 502 `upstream_transport_error` may already have reached the
        upstream), and one type can appear at more than one status
        (`upstream_connect_failed` is 502 when the connection is refused
        or the host does not resolve, 504 when connecting times out).
      headers:
        Jentic-Error-Origin:
          $ref: "#/components/headers/JenticErrorOrigin"
        Jentic-Upstream-Status:
          $ref: "#/components/headers/JenticUpstreamStatus"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BrokerProblem"
          examples:
            upstream_timeout:
              summary: Upstream did not respond within the broker's deadline.
              value:
                type: upstream_timeout
                title: The upstream did not respond within the deadline.
                status: 504
                detail: The upstream did not respond within the deadline.
                error_origin: broker
                instance: /api.example.com/v1/reports
            upstream_response_too_large:
              summary: The broker aborted an upstream response over its size cap.
              value:
                type: upstream_response_too_large
                title: The upstream response exceeded the 10485760-byte response-size cap.
                status: 502
                detail: The upstream response exceeded the 10485760-byte response-size cap.
                error_origin: broker
                max_response_bytes: 10485760
                instance: /api.example.com/v1/reports
            upstream_transport_error:
              summary: >-
                The upstream connection failed (e.g. dropped mid-response); 502 Bad Gateway.
                The request may have reached the upstream, so retry only an idempotent
                or Idempotency-Key'd call.
              value:
                type: upstream_transport_error
                title: Upstream transport error (RemoteProtocolError)
                status: 502
                detail: Upstream transport error (RemoteProtocolError)
                error_origin: broker
                instance: /api.example.com/v1/reports
            upstream_connect_failed:
              summary: >-
                The upstream refused the connection or its host did not resolve; no request
                bytes were sent, so a retry is safe for any method.
              value:
                type: upstream_connect_failed
                title: The upstream connection could not be established.
                status: 502
                detail: The upstream connection could not be established.
                error_origin: broker
                instance: /api.example.com/v1/reports
            upstream_connect_timeout:
              summary: >-
                Connecting to the upstream timed out; no request bytes were sent, so a retry
                is safe for any method.
              value:
                type: upstream_connect_failed
                title: The upstream connection could not be established in time.
                status: 504
                detail: The upstream connection could not be established in time.
                error_origin: broker
                instance: /api.example.com/v1/reports
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      # bearerFormat is intentionally omitted: the Broker accepts several
      # interchangeable credential formats (opaque access tokens, API keys,
      # and self-contained JWTs) — not JWTs alone — so pinning
      # `bearerFormat: JWT` would misrepresent the contract.
      description: |
        Credential authorizing a Broker call, sent as
        `Authorization: Bearer <token>`. The Broker accepts several
        interchangeable credential formats, dispatched by prefix/shape:

        - **Opaque access tokens** (`at_…`) — the *same* tokens the control
          plane issues from `POST /oauth/token`. A random string validated by
          server-side lookup (it is **not** a JWT and cannot be decoded by the
          client). Broker and control plane share one token store, so a token
          minted for the control plane authenticates here too.
        - **API keys** — agent (`jak_…`) keys.
          May alternatively be sent in the `x-jentic-api-key` header. The
          `jntc_live_…` toolkit-key form is **retired** (theme-5): a value
          migrated before the toolkit tables were dropped still authenticates
          as its successor agent until the deprecation window closes (no
          earlier than 2026-12-01); rotate holders to that agent's `jak_` key.
          The `sak_…` service-account-key form is retired the same way
          (theme-8): a migrated value authenticates as its successor agent
          until its deprecation window closes.
        - **Self-contained JWTs** — verified by signature (a dev HS256 shared
          secret or a configured trusted issuer with JWKS rotation). The Broker
          is identity-provider-agnostic: the IdP, federation strategy, and
          token-issuance flow are deployment concerns outside this spec.

        Every protected operation requires the `capabilities:execute` permission,
        whatever the credential format. Authorization beyond "may execute"
        (agent-credential bindings, permission rules, revision pinning) is
        enforced per-request and is not modelled here.
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0 authorization code flow with PKCE (`S256` only), run by the
        control plane's authorization server. The resulting access token is
        the same opaque `at_…` bearer token `BearerAuth` describes — the
        Broker and control plane share one token store — sent as
        `Authorization: Bearer <token>`.

        Scopes are permission names; executing through the Broker requires
        `capabilities:execute`. A scope only narrows a grant to a subset of
        the actor's permissions, never widens it. Agents normally
        authenticate with an agent API key or the control plane's
        JWT-bearer grant instead — see `BearerAuth`.
      flows:
        authorizationCode:
          authorizationUrl: https://control.your-instance.example/authorize
          tokenUrl: https://control.your-instance.example/oauth/token
          refreshUrl: https://control.your-instance.example/oauth/token
          scopes:
            capabilities:execute: Execute capabilities via the broker.
